<script>
  /* Aplica o tema salvo antes da primeira pintura (evita flash de tela clara).
     ?tema=dark|light define apenas o PADRÃO inicial — usado quando o app é
     embutido em outro sistema. A escolha do usuário sempre tem prioridade. */
  (function () {
    try {
      var t = localStorage.getItem('oao:tema');
      if (!t) {
        var q = /[?&]tema=(dark|light)/.exec(location.search);
        t = q ? q[1]
              : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      }
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
    /* Embutido em outro sistema (iframe): liga a densidade compacta antes da
       primeira pintura, já que a barra do host consome altura da tela. */
    try {
      if (window.self !== window.top) document.documentElement.classList.add('is-embed');
    } catch (e) { document.documentElement.classList.add('is-embed'); }
  })();
</script>

<!-- ===================== BASE COMPARTILHADA (Firebase) =====================
     Carregado por modulo ES INLINE de proposito: modulo externo via src e
     bloqueado pelo navegador em file://, e o app precisa rodar tambem por
     duplo clique. Import dinamico para que a falta de internet nao quebre a
     pagina — o boot cai no armazenamento local e o app segue funcionando.  -->
<script type="module">
  (async function () {
    try {
      const [appMod, dbMod] = await Promise.all([
        import('https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js'),
        import('https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js')
      ]);
      const fbApp = appMod.initializeApp({
        apiKey: "AIzaSyA3npsv6oAI5AUFYdaYskbq2_7AF_KMXi0",
        authDomain: "dashboardcomercialpa.firebaseapp.com",
        databaseURL: "https://dashboardcomercialpa-default-rtdb.firebaseio.com",
        projectId: "dashboardcomercialpa",
        storageBucket: "dashboardcomercialpa.firebasestorage.app",
        messagingSenderId: "861156523238",
        appId: "1:861156523238:web:98dd0f1734e6f983184f27"
      }, 'evolui');

      window.EvoluiFB = {
        db: dbMod.getDatabase(fbApp),
        ref: dbMod.ref, get: dbMod.get, set: dbMod.set,
        update: dbMod.update, remove: dbMod.remove, onValue: dbMod.onValue
      };
      window.dispatchEvent(new Event('evolui-fb:pronto'));
    } catch (e) {
      console.warn('[evolui] Firebase indisponivel:', e && e.message);
      window.EvoluiFBErro = e;
      window.dispatchEvent(new Event('evolui-fb:erro'));
    }
  })();
</script>
