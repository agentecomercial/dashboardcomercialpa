<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>APP CHAMADO — Setor Comercial</title>
<!-- ===== PWA (instalável no Android e iPhone) ===== -->
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#8b5cf6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Chamados">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/favicon.png">
<style>
:root{
  --bg:#f1f5f9; --surface:#ffffff; --surface-2:#f8fafc; --border:#e2e8f0;
  --text:#0f172a; --muted:#64748b; --accent:#4f46e5; --accent-soft:#eef2ff;
  --green:#16a34a; --green-soft:#dcfce7; --amber:#d97706; --amber-soft:#fef3c7;
  --red:#dc2626; --red-soft:#fee2e2; --blue:#2563eb; --blue-soft:#dbeafe;
  --shadow:0 1px 3px rgba(15,23,42,.08),0 1px 2px rgba(15,23,42,.04);
  --shadow-lg:0 10px 30px rgba(15,23,42,.14);
  --radius:14px; --sidebar:236px;
}
[data-theme="dark"]{
  --bg:#0b1120; --surface:#111827; --surface-2:#0f172a; --border:#1f2937;
  --text:#e5e7eb; --muted:#94a3b8; --accent:#6366f1; --accent-soft:#1e1b4b;
  --green:#22c55e; --green-soft:#0f2e1c; --amber:#f59e0b; --amber-soft:#3a2c07;
  --red:#ef4444; --red-soft:#3a1113; --blue:#3b82f6; --blue-soft:#0e2140;
  --shadow:0 1px 3px rgba(0,0,0,.5); --shadow-lg:0 12px 34px rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);
  font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px}
a{color:var(--accent);text-decoration:none}
.hidden{display:none!important}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px}

/* ---------- LOGIN ---------- */
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(1200px 600px at 20% -10%,var(--accent-soft),transparent),var(--bg);z-index:60}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:34px 32px;width:380px;
  max-width:92vw;box-shadow:var(--shadow-lg)}
.login-logo{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.login-logo .mark{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--accent),#7c3aed);
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px}
.login-logo h1{font-size:19px;margin:0;letter-spacing:-.3px}
.login-logo p{margin:0;font-size:12px;color:var(--muted)}
.field{margin-top:14px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:11px 13px;border:1px solid var(--border);
  border-radius:10px;background:var(--surface-2);color:var(--text);outline:none;transition:border .15s,box-shadow .15s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;border-radius:10px;
  border:1px solid transparent;background:var(--accent);color:#fff;font-weight:600;font-size:14px;transition:filter .15s,transform .05s}
.btn:hover{filter:brightness(1.06)} .btn:active{transform:translateY(1px)}
.btn.block{width:100%;margin-top:18px}
.btn.ghost{background:transparent;color:var(--text);border-color:var(--border)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:7px 11px;font-size:12.5px;border-radius:9px}
.btn.subtle{background:var(--surface-2);color:var(--text);border-color:var(--border)}
.link-mini{background:none;border:none;color:var(--accent);font-size:12.5px;padding:0;margin-top:12px}
.login-msg{margin-top:12px;font-size:13px;min-height:18px}
.login-msg.err{color:var(--red)} .login-msg.ok{color:var(--green)}

/* ---------- SHELL ---------- */
#app{display:flex;min-height:100vh}
#sidebar{width:var(--sidebar);background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;z-index:40;transition:width .2s,transform .2s}
#sidebar .brand{display:flex;align-items:center;gap:11px;padding:18px 18px 14px}
#sidebar .brand .mark{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#7c3aed);
  color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;flex:0 0 auto}
#sidebar .brand b{font-size:15px;letter-spacing:-.2px;white-space:nowrap}
#sidebar .brand small{display:block;color:var(--muted);font-size:11px}
.nav{padding:8px;display:flex;flex-direction:column;gap:2px;flex:1}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--muted);
  font-weight:600;font-size:13.5px;white-space:nowrap;cursor:pointer}
.nav a svg{width:19px;height:19px;flex:0 0 auto}
.nav a:hover{background:var(--surface-2);color:var(--text)}
.nav a.active{background:var(--accent-soft);color:var(--accent)}
.nav .badge{margin-left:auto;background:var(--red);color:#fff;border-radius:20px;font-size:11px;padding:1px 7px;font-weight:700}
.side-foot{padding:10px;border-top:1px solid var(--border)}
.userchip{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;
  justify-content:center;font-weight:700;font-size:13px;flex:0 0 auto}
.userchip .info{overflow:hidden;flex:1} .userchip .info b{font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.userchip .info small{color:var(--muted);font-size:11px}
body.collapsed #sidebar{width:66px}
body.collapsed #sidebar .brand b,body.collapsed #sidebar .brand small,
body.collapsed .nav a span,body.collapsed .userchip .info,body.collapsed .nav .badge{display:none}
body.collapsed .nav a{justify-content:center}
#main{flex:1;margin-left:var(--sidebar);transition:margin .2s;min-width:0}
body.collapsed #main{margin-left:66px}

/* topbar */
.topbar{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:12px;padding:11px 20px}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2);
  color:var(--text);display:flex;align-items:center;justify-content:center;position:relative}
.icon-btn:hover{background:var(--border)}
.icon-btn svg{width:18px;height:18px}
.icon-btn .dot{position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;border-radius:20px;
  font-size:10px;min-width:16px;height:16px;padding:0 4px;display:flex;align-items:center;justify-content:center;font-weight:700}
.topbar h2{font-size:17px;margin:0;font-weight:700;letter-spacing:-.3px}
.topbar .spacer{flex:1}
.search-top{position:relative}
.search-top input{padding:9px 12px 9px 34px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2);
  color:var(--text);width:230px;outline:none}
.search-top svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.content{padding:22px}

/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.stat{display:flex;flex-direction:column;gap:6px;cursor:pointer;transition:transform .08s,box-shadow .15s}
.stat:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.stat .top{display:flex;align-items:center;justify-content:space-between}
.stat .ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center}
.stat .ic svg{width:18px;height:18px}
.stat .n{font-size:28px;font-weight:800;letter-spacing:-1px}
.stat .lbl{font-size:12.5px;color:var(--muted);font-weight:600}
.b-accent{background:var(--accent-soft);color:var(--accent)} .b-blue{background:var(--blue-soft);color:var(--blue)}
.b-green{background:var(--green-soft);color:var(--green)} .b-amber{background:var(--amber-soft);color:var(--amber)}
.b-red{background:var(--red-soft);color:var(--red)} .b-muted{background:var(--surface-2);color:var(--muted)}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:16px}
@media(max-width:1000px){.grid2,.grid3{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.panel h3{margin:0;padding:14px 16px;font-size:14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.panel h3 .cnt{margin-left:auto;color:var(--muted);font-weight:600;font-size:12px}
.panel .body{padding:6px 16px 14px}
.mini-list{display:flex;flex-direction:column}
.mini-item{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--border);cursor:pointer}
.mini-item:last-child{border-bottom:none}
.mini-item:hover .mtit{color:var(--accent)}
.mini-item .mtit{font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini-item .msub{font-size:12px;color:var(--muted)}
.mini-item .grow{flex:1;min-width:0}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:700;white-space:nowrap}
.pill.dot::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st-Aberto{background:var(--blue-soft);color:var(--blue)}
.st-EmAtendimento{background:var(--accent-soft);color:var(--accent)}
.st-AguardandoResposta{background:var(--amber-soft);color:var(--amber)}
.st-Resolvido{background:var(--green-soft);color:var(--green)}
.st-Encerrado{background:var(--surface-2);color:var(--muted)}
.pr-Baixa{background:var(--surface-2);color:var(--muted)} .pr-Media{background:var(--blue-soft);color:var(--blue)}
.pr-Alta{background:var(--amber-soft);color:var(--amber)} .pr-Urgente{background:var(--red-soft);color:var(--red)}
.cr-normal{background:var(--green-soft);color:var(--green)} .cr-medio{background:var(--amber-soft);color:var(--amber)}
.cr-critico{background:var(--red-soft);color:var(--red)}
.crdot{width:9px;height:9px;border-radius:50%;display:inline-block}
.crdot.normal{background:var(--green)} .crdot.medio{background:var(--amber)} .crdot.critico{background:var(--red)}

/* toolbar da lista */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:7px 12px;border-radius:20px;border:1px solid var(--border);background:var(--surface);color:var(--muted);
  font-weight:600;font-size:12.5px}
.chip:hover{background:var(--surface-2)}
.chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.toolbar select{padding:8px 10px;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text)}

/* tabela */
.tablewrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:auto;box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;min-width:920px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);
  padding:12px 14px;border-bottom:1px solid var(--border);background:var(--surface-2);cursor:pointer;white-space:nowrap;user-select:none}
th:hover{color:var(--text)}
td{padding:12px 14px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle}
tbody tr{cursor:pointer} tbody tr:hover{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:none}
.num{font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.td-title{font-weight:600;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.star{background:none;border:none;font-size:16px;color:var(--muted);padding:2px;line-height:1}
.star.on{color:#f59e0b}
.empty{padding:50px 20px;text-align:center;color:var(--muted)}
.empty svg{width:46px;height:46px;opacity:.4;margin-bottom:8px}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);backdrop-filter:blur(2px);z-index:50;
  display:flex;align-items:flex-start;justify-content:center;padding:34px 16px;overflow:auto}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:18px;width:640px;max-width:100%;
  box-shadow:var(--shadow-lg);animation:pop .16s ease}
.modal.wide{width:840px}
@keyframes pop{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.modal-head{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--border)}
.modal-head h3{margin:0;font-size:16px;flex:1}
.modal-body{padding:18px 20px}
.modal-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end}
.close-x{width:34px;height:34px;border-radius:9px;border:1px solid var(--border);background:var(--surface-2);color:var(--muted);
  display:flex;align-items:center;justify-content:center;font-size:18px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:560px){.row2{grid-template-columns:1fr}}
.solic-box{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:12px 14px;
  display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
@media(max-width:560px){.solic-box{grid-template-columns:1fr 1fr}}
.solic-box .k{font-size:11px;color:var(--muted);font-weight:600}
.solic-box .v{font-size:13.5px;font-weight:600;margin-top:2px}
.dropzone{border:1.5px dashed var(--border);border-radius:12px;padding:12px;margin-top:8px;text-align:center;color:var(--muted);font-size:12.5px}
.dropzone.drag{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.anexos{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.anexo{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;
  padding:6px 10px;font-size:12.5px;max-width:100%}
.anexo img{width:34px;height:34px;object-fit:cover;border-radius:6px}
.anexo .x{background:none;border:none;color:var(--muted);font-size:15px;padding:0 2px}
.anexo a{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:180px}

/* detalhe / timeline */
.detail-grid{display:grid;grid-template-columns:1fr 260px;gap:18px}
@media(max-width:720px){.detail-grid{grid-template-columns:1fr}}
.meta-row{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.relato{white-space:pre-wrap;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:14px;font-size:13.5px}
/* links detectados no texto (relato, comentarios) */
a.lnk{color:var(--accent);font-weight:600;text-decoration:none;border-bottom:1px solid transparent;word-break:break-all}
a.lnk:hover{border-bottom-color:var(--accent)}
a.lnk::before{content:'🔗 ';font-weight:400}
a.lnk.mail::before{content:'✉️ '}
/* botao Atualizar girando */
@keyframes chm-girar{to{transform:rotate(360deg)}}
#btnAtualizar.girando svg{animation:chm-girar .6s linear}
/* painel de departamentos: linha clicavel + membros */
.dep-row{cursor:pointer}
.dep-row:hover{background:var(--surface-2)}
.dep-row.on{background:var(--accent-soft)}
.dep-seta{color:var(--muted);font-size:11px;margin-right:2px}
.dep-lista{display:flex;flex-direction:column;gap:6px;padding:4px 6px 0}
.dep-membro{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);
  border-radius:11px;padding:8px 12px}
.side-card{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:14px}
.side-card .kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:13px;border-bottom:1px dashed var(--border)}
.side-card .kv:last-child{border-bottom:none}
.side-card .kv .k{color:var(--muted)}
.timeline{margin-top:6px;position:relative;padding-left:22px}
.timeline::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--border)}
.tl-item{position:relative;padding:0 0 16px}
.tl-item::before{content:"";position:absolute;left:-22px;top:3px;width:12px;height:12px;border-radius:50%;
  background:var(--surface);border:2px solid var(--accent)}
.tl-item.c-status::before{border-color:var(--blue)} .tl-item.c-comentario::before{border-color:var(--green)}
.tl-item.c-interno::before{border-color:var(--amber)}
.tl-when{font-size:11.5px;color:var(--muted)}
.tl-who{font-weight:700;font-size:13px}
.tl-text{font-size:13px;margin-top:2px;white-space:pre-wrap}
.tl-badge{font-size:10.5px;font-weight:700;color:var(--amber);border:1px solid var(--amber);border-radius:6px;padding:0 5px;margin-left:6px}
/* chamado fechado: faixa de travamento, vinculos e pedido de reabertura */
.trava{display:flex;align-items:center;gap:12px;background:var(--green-soft);border:1px solid var(--green);
  border-radius:13px;padding:12px 15px;margin-bottom:14px}
.trava.enc{background:var(--surface-2);border-color:var(--border)}
.trava .ic{font-size:20px}
.trava b{display:block;font-size:13.5px}
.trava small{color:var(--muted);font-size:12px}
.trava .acoes{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.vinc-faixa{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--accent-soft);
  border:1px solid var(--accent);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:13px}
.vinc-faixa a{font-weight:800}
.chip-herda{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--border);
  border-radius:999px;padding:5px 11px;font-size:12px;font-weight:600;color:var(--muted)}
.chip-herda b{color:var(--text);font-weight:700}
.reab-card{background:var(--amber-soft);border:1px solid var(--amber);border-radius:13px;padding:12px 15px;margin-bottom:14px}
.reab-card.ok{background:var(--green-soft);border-color:var(--green)}
.reab-card.nao{background:var(--surface-2);border-color:var(--border)}
.reab-card b{font-size:13.5px}
.reab-card .quem{color:var(--muted);font-size:12px;margin-top:2px}
.reab-card .motivo{font-size:13px;margin-top:7px;white-space:pre-wrap}
/* acoes do ADM no proprio ultimo comentario */
.tl-acoes{display:flex;gap:6px;margin-top:6px}
.tl-acao{background:var(--surface-2);border:1px solid var(--border);color:var(--muted);border-radius:8px;
  padding:3px 9px;font-size:11.5px;font-weight:700;cursor:pointer}
.tl-acao:hover{border-color:var(--accent);color:var(--accent)}
.tl-acao.del:hover{border-color:var(--red);color:var(--red)}
.tl-edit{width:100%;min-height:70px;border:1px solid var(--accent);border-radius:10px;padding:9px 11px;
  background:var(--surface);color:var(--text);font-family:inherit;font-size:13px;resize:vertical;outline:none}
.comment-box{margin-top:14px;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:12px}
.comment-box textarea{width:100%;border:1px solid var(--border);border-radius:10px;padding:10px;background:var(--surface);color:var(--text);resize:vertical;min-height:64px;outline:none}
.inline-opts{display:flex;align-items:center;gap:12px;margin-top:8px;flex-wrap:wrap}
.chkbx{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);font-weight:600}

/* charts */
.bar-row{display:flex;align-items:center;gap:10px;margin:9px 0}
.bar-row .bl{width:120px;font-size:12.5px;color:var(--muted);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:0 0 auto}
.bar-track{flex:1;background:var(--surface-2);border-radius:8px;height:22px;overflow:hidden}
.bar-fill{height:100%;border-radius:8px;display:flex;align-items:center;padding-left:8px;color:#fff;font-size:11.5px;font-weight:700;min-width:26px;transition:width .5s}
.donut-wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding:8px 0}
.donut{width:150px;height:150px;border-radius:50%;flex:0 0 auto}
.donut-legend{display:flex;flex-direction:column;gap:8px}
.leg{display:flex;align-items:center;gap:8px;font-size:12.5px}
.leg .sw{width:12px;height:12px;border-radius:4px}
.leg b{margin-left:auto;font-variant-numeric:tabular-nums}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.kpi .n{font-size:26px;font-weight:800;letter-spacing:-.5px}
.kpi .l{color:var(--muted);font-size:12.5px;font-weight:600;margin-top:4px}
.kpi .s{font-size:11.5px;color:var(--muted);margin-top:2px}

/* fila */
.fila-item{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--border);
  border-radius:12px;padding:12px 16px;margin-bottom:10px;box-shadow:var(--shadow);cursor:pointer}
.fila-item:hover{border-color:var(--accent)}
.fila-pos{width:40px;height:40px;border-radius:12px;background:var(--accent-soft);color:var(--accent);font-weight:800;
  display:flex;align-items:center;justify-content:center;font-size:16px;flex:0 0 auto}
.fila-item.critico .fila-pos{background:var(--red-soft);color:var(--red)}
.fila-item.medio .fila-pos{background:var(--amber-soft);color:var(--amber)}
.fila-main{flex:1;min-width:0} .fila-main b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fila-main small{color:var(--muted)}

/* notif dropdown */
.dropdown{position:absolute;top:52px;right:16px;width:340px;max-width:92vw;background:var(--surface);border:1px solid var(--border);
  border-radius:14px;box-shadow:var(--shadow-lg);z-index:45;overflow:hidden}
.dropdown h4{margin:0;padding:13px 16px;font-size:13.5px;border-bottom:1px solid var(--border);display:flex;align-items:center}
.dropdown h4 button{margin-left:auto;font-size:11.5px;background:none;border:none;color:var(--accent)}
.notif{padding:11px 16px;border-bottom:1px solid var(--border);cursor:pointer;display:flex;gap:10px}
.notif:hover{background:var(--surface-2)}
.notif:last-child{border-bottom:none}
.notif .nic{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.notif .nt{font-size:13px;font-weight:600} .notif .nd{font-size:11.5px;color:var(--muted)}

/* toast */
#toasts{position:fixed;bottom:20px;right:20px;z-index:70;display:flex;flex-direction:column;gap:10px}
.toast{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:12px;
  padding:12px 16px;box-shadow:var(--shadow-lg);min-width:250px;max-width:340px;animation:slidein .2s}
.toast.ok{border-left-color:var(--green)} .toast.err{border-left-color:var(--red)}
.toast b{font-size:13.5px} .toast p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
@keyframes slidein{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}

.mobile-toggle{display:none}
@media(max-width:820px){
  #sidebar{transform:translateX(-100%)} body.mobile-open #sidebar{transform:none;box-shadow:var(--shadow-lg)}
  #main{margin-left:0} body.collapsed #main{margin-left:0}
  .mobile-toggle{display:flex} .search-top input{width:150px}
}
@media print{
  #sidebar,.topbar,.modal-foot,.comment-box,.no-print{display:none!important}
  #main{margin:0!important} .overlay{position:static;background:none;padding:0;display:block}
  .modal{box-shadow:none;border:none;width:100%}
}

/* ==================================================================
   GLOW-UP — dá vida ao app (profundidade, brilho, micro-interações).
   Tudo usa tokens, então cada tema herda automaticamente.
   ================================================================== */
:root{ --accent2:#7c3aed; --grad:linear-gradient(135deg,var(--accent),var(--accent2));
  --glow-color:rgba(79,70,229,.14); --glow:0 0 26px -8px var(--glow-color); --app-bg:var(--bg); }
[data-theme="dark"]{ --accent2:#8b5cf6; --glow-color:rgba(99,102,241,.24); }

/* fundo com profundidade + blobs de luz ambiente */
body{background:var(--app-bg)}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(55% 45% at 88% -8%,var(--glow-color),transparent 70%),
            radial-gradient(48% 42% at -8% 108%,var(--glow-color),transparent 72%)}
#app{position:relative;z-index:1}

/* marca e navegação vivas */
#sidebar .brand .mark,.login-logo .mark{background:var(--grad);box-shadow:var(--glow)}
.nav a{transition:background .15s,color .15s,box-shadow .15s}
.nav a.active{position:relative;box-shadow:var(--glow)}
.nav a.active::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--grad)}
.avatar{background:var(--grad)!important;box-shadow:var(--glow)}

/* topbar com leve profundidade */
.topbar{box-shadow:0 1px 0 var(--border),0 6px 18px -14px rgba(0,0,0,.5)}

/* KPI cards com relevo, faixa de acento e brilho no hover */
.stat{position:relative;overflow:hidden;transition:transform .12s,box-shadow .2s,border-color .2s}
.stat::after{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--grad);opacity:.85;z-index:2}
.stat::before{content:"";position:absolute;inset:0;z-index:0;background:linear-gradient(180deg,rgba(255,255,255,.05),transparent 40%);pointer-events:none}
.stat>*{position:relative;z-index:1}
.stat .ic{box-shadow:var(--glow)}
.stat:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg),var(--glow)}
.stat .n{font-size:30px}

/* painéis e tabela reagindo ao hover */
.panel,.tablewrap,.kpi{transition:box-shadow .2s,border-color .2s}
.panel:hover,.kpi:hover{box-shadow:var(--shadow-lg)}
.kpi{position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--grad);opacity:.8}

/* botão primário com gradiente + brilho */
.btn:not(.ghost):not(.subtle){background:var(--grad);box-shadow:0 6px 16px -8px var(--glow-color)}
.btn:not(.ghost):not(.subtle):hover{filter:brightness(1.08)}

/* pill "ao vivo"/dot pulsando */
@keyframes chmPulse{0%{box-shadow:0 0 0 0 var(--glow-color)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.icon-btn .dot{animation:chmPulse 2.2s infinite}

/* entrada suave das telas */
.content{animation:chmFade .28s ease}
@keyframes chmFade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.mini-item,.fila-item,.card.stat{animation:chmFade .32s ease both}

/* ================= CONFIGURAÇÕES ================= */
.cfg-sec{margin-bottom:10px}
.cfg-t{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
.skin-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.skin-opt{display:flex;flex-direction:column;gap:0;padding:0;border:1px solid var(--border);border-radius:12px;
  background:var(--surface-2);overflow:hidden;cursor:pointer;transition:transform .1s,border-color .15s,box-shadow .15s;text-align:left}
.skin-opt:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.skin-opt.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft),var(--glow)}
.skin-prev{height:56px;position:relative}
.skin-prev::after{content:"";position:absolute;left:10px;bottom:8px;width:34px;height:6px;border-radius:6px;background:rgba(255,255,255,.85);box-shadow:0 0 10px rgba(255,255,255,.4)}
.skin-nm{padding:8px 10px;font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:6px}
.skin-opt.sel .skin-nm::after{content:"✓";margin-left:auto;color:var(--accent);font-weight:800}

/* ================= MODO APRESENTAÇÃO (TOUR GUIADO) ================= */
#tourRoot{position:fixed;inset:0;z-index:9000}
#tourRoot.hidden{display:none}
#tourDim{position:absolute;inset:0;pointer-events:auto;background:transparent}
#tourSpot{position:absolute;border-radius:14px;pointer-events:none;display:none;
  box-shadow:0 0 0 9999px rgba(8,11,22,.74),0 0 30px rgba(99,102,241,.55);
  outline:2.5px solid var(--accent);outline-offset:0;transition:left .5s cubic-bezier(.22,1,.36,1),top .5s cubic-bezier(.22,1,.36,1),width .5s,height .5s}
#tourStageWrap{position:absolute;inset:0;display:none;align-items:center;justify-content:center;pointer-events:none;padding:78px 20px 128px;
  background:rgba(8,11,22,.74)}
#tourStageWrap.on{display:flex}
#tourStage{width:min(760px,94vw);max-height:100%;overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:16px;
  box-shadow:0 40px 120px rgba(0,0,0,.55);pointer-events:none;animation:tPop .4s ease}
#tourStage .th{height:34px;background:var(--surface-2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:6px;padding:0 12px}
#tourStage .th i{width:11px;height:11px;border-radius:50%;background:var(--border)}
#tourStage .tb{padding:18px}
@keyframes tPop{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.thl{outline:2.5px solid var(--accent)!important;outline-offset:3px;border-radius:10px;
  box-shadow:0 0 0 5px var(--accent-soft),0 0 26px rgba(99,102,241,.5)!important;transition:.3s;position:relative;z-index:1}
#tourCard{position:absolute;max-width:330px;min-width:230px;background:var(--surface);border:1px solid var(--border);border-radius:14px;
  box-shadow:0 22px 55px rgba(0,0,0,.55);padding:14px 16px;pointer-events:auto;z-index:6;
  transition:left .45s cubic-bezier(.22,1,.36,1),top .45s cubic-bezier(.22,1,.36,1)}
#tourCard .tc-feat{font-size:10.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--accent)}
#tourCard .tc-txt{font-size:14.5px;margin-top:5px;line-height:1.45}
#tourCard .tc-goto{margin-top:11px}
#tourBar{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);background:var(--surface);border:1px solid var(--border);
  border-radius:16px;box-shadow:0 18px 50px rgba(0,0,0,.5);padding:9px 13px;display:flex;align-items:center;gap:8px;
  pointer-events:auto;z-index:7;max-width:96vw;flex-wrap:wrap;justify-content:center}
#tourBar .tprog{width:150px;height:6px;background:var(--surface-2);border-radius:6px;overflow:hidden}
#tourBar .tprog i{display:block;height:100%;width:0;background:var(--grad);border-radius:6px;transition:width .2s linear}
#tourBar .tbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);
  display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;transition:.15s}
#tourBar .tbtn:hover{background:var(--border);border-color:var(--accent)}
#tourBar .tbtn.pri{background:var(--grad);color:#fff;border:none;width:44px;height:44px;font-size:17px}
#tourBar .tbtn.off{opacity:.4}
#tourBar .tspeed{border:1px solid var(--border);background:var(--surface-2);border-radius:10px;padding:0 12px;height:38px;font-weight:800;
  cursor:pointer;color:var(--text);font-size:13px}
#tourBar .tmeta{font-size:12px;color:var(--muted);font-weight:700;min-width:112px;text-align:center;font-variant-numeric:tabular-nums}
@media(max-width:640px){#tourCard{max-width:78vw}#tourBar .tprog{width:96px}#tourBar .tmeta{min-width:0}}

/* ================= MOBILE — Gradiente Vibrante (modelo 8) ================= */
#mtop,#mnav,#mfab{display:none}

  #sidebar{display:none!important}
  #main{margin-left:0!important}
  .topbar{display:none!important}

  #app,#main,.content{min-width:0;max-width:100%}

  /* HERO em gradiente */
  #mtop{display:block;position:sticky;top:0;z-index:35;color:#fff;border-radius:0 0 24px 24px;
    background:linear-gradient(140deg,#8b5cf6,#ec4899);padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 16px;

  #mtop .search input{border:none;background:transparent;color:#fff;font-size:14px;flex:1;outline:none;min-width:0}

<script>
/* ================================================================= STATE */
const S = { token:localStorage.getItem('chm_token')||'', user:null, usuarios:[], departamentos:[], chamados:[], serverTime:null };
const ASSUNTOS = ['Comercial','CRM','Matrículas','Financeiro','Marketing','Eventos','Tecnologia','Outros'];
const PRIORIDADES = ['Baixa','Média','Alta','Urgente'];
const STATUSES = ['Aberto','Em Atendimento','Aguardando Resposta','Resolvido','Encerrado'];
const FINALIZADOS = ['Resolvido','Encerrado'];
let route = 'dashboard';
let listFilter = 'todos', listSearch = '', listSort = {key:'numero', dir:-1};
let lastSeen = +(localStorage.getItem('chm_lastseen')||0);
let notifOpen = false, refreshTimer=null, prevEventCount=null;

/* ================================================================= UTIL */
const $ = s => document.querySelector(s);
const isMobile=()=>window.matchMedia('(max-width:680px)').matches;
const el = (t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
/* Escapa o texto e transforma URLs (http, https, www., ou dominio.com/caminho)
   em links clicaveis que abrem em nova aba. O esc() vem PRIMEIRO — o que entra
   no href ja esta escapado, entao texto colado pelo usuario nao vira HTML.     */
const RE_LINK = /\b[a-z0-9._%+-]+@[a-z0-9-]+(?:\.[a-z]{2,})+\b|\b(?:https?:\/\/|www\.)[^\s<>"']+|\b[a-z0-9][-a-z0-9.]*\.(?:com|com\.br|org|net|br|io|app|gov\.br|edu\.br)(?:\/[^\s<>"']*)?/gi;
function linkify(s){
  return esc(s).replace(RE_LINK, bruto=>{
    const corte = bruto.match(/(?:&(?:amp|quot|#39|lt|gt);|[.,;:!?)\]}]+)+$/);   // pontuacao final nao faz parte do link
    const alvo  = corte ? bruto.slice(0, corte.index) : bruto;
    const sobra = corte ? bruto.slice(corte.index) : '';
    if(!/[a-z0-9]/i.test(alvo)) return bruto;
    const email = alvo.includes('@') && !/:\/\//.test(alvo);
    const href  = email ? 'mailto:'+alvo : (/^https?:\/\//i.test(alvo) ? alvo : 'https://'+alvo);
    const cls   = email ? 'lnk mail' : 'lnk';
    return `<a class="${cls}" href="${href}"${email?'':' target="_blank" rel="noopener noreferrer"'}>${alvo}</a>${sobra}`;
  });
}
const stKey = s => 'st-'+String(s).replace(/\s/g,'');
const prKey = p => 'pr-'+String(p).replace('é','e').replace('É','E');
const initials = n => (n||'?').trim().split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase();
function fmtDate(iso){ if(!iso) return '—'; const d=new Date(iso); return d.toLocaleDateString('pt-BR')+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); }
function fmtDay(iso){ if(!iso) return '—'; return new Date(iso).toLocaleDateString('pt-BR'); }
function agora(){ return S.serverTime ? new Date(S.serverTime) : new Date(); }

function endTime(c){ return FINALIZADOS.includes(c.status) ? new Date(c.atualizadoEm||c.criadoEm) : new Date(); }
function msAberto(c){ return endTime(c) - new Date(c.criadoEm); }
function diasAberto(c){ return Math.floor(msAberto(c)/86400000); }
function criticidade(c){ const d=diasAberto(c); if(d>=4) return 'critico'; if(d>=2) return 'medio'; return 'normal'; }
function critLabel(k){ return {normal:'Normal',medio:'Médio',critico:'Crítico'}[k]; }
function liveStr(c){
  const ms=msAberto(c); const d=Math.floor(ms/86400000), h=Math.floor(ms%86400000/3600000), m=Math.floor(ms%3600000/60000);
  if(d>0) return `${d}d ${h}h`; if(h>0) return `${h}h ${m}m`; return `${m}m`;
}
function isFinal(c){ return FINALIZADOS.includes(c.status); }
function visiveis(){ return S.chamados; }  // servidor ja filtra por permissao
function perfilLabel(p){ return {adm:'ADM',gestor:'Gestor',consultor:'Consultor'}[p]||p; }
function isManager(){ return S.user && (S.user.perfil==='adm' || S.user.perfil==='gestor'); }
function isAdm(){ return S.user && S.user.perfil==='adm'; }
/* ---- departamentos ----
   Consultor fala SO com o gestor do proprio departamento; gestor fala com os
   outros gestores e com o ADM; o ADM fala com todo mundo. O servidor aplica a
   mesma regra (Can-SeeUser / Can-Send) — aqui e so a tela.                    */
function depNome(id){ const d=(S.departamentos||[]).find(x=>x.id===id); return d?d.nome:'—'; }
function depsAtivos(){ return (S.departamentos||[]).filter(d=>d.ativo); }
function meuDep(){ return (S.user&&S.user.departamentoId)||''; }
function alvosPermitidos(){
  const ativos=(S.usuarios||[]).filter(u=>u.ativo && u.id!==S.user.id);
  if(isAdm()) return ativos;
  if(S.user.perfil==='gestor') return ativos.filter(u=>u.perfil==='gestor'||u.perfil==='adm');
  const gest=ativos.filter(u=>u.perfil==='gestor' && u.departamentoId===meuDep());
  return gest.length?gest:ativos.filter(u=>u.perfil==='adm');   // sem gestor no depto: cai no ADM
}
// Excluir: ADM sempre; senão, só o criador e dentro de 12h da abertura.
function podeExcluir(c){
  if(isAdm()) return true;
  if(c.solicitanteId===S.user.id){ return (agora()-new Date(c.criadoEm))/3600000 < 12; }
  return false;
}

/* ================================================================= API */
async function api(path, {method='GET', body}={}){
  const opt={method,headers:{}};
  if(S.token) opt.headers['X-Token']=S.token;
  if(body!==undefined){ opt.headers['Content-Type']='application/json; charset=utf-8'; opt.body=JSON.stringify(body); }
  const r=await fetch(path,opt);
  const txt=await r.text(); let data=null; try{data=txt?JSON.parse(txt):null;}catch{data={raw:txt};}
  if(!r.ok) throw new Error((data&&data.erro)||('HTTP '+r.status));
  return data;
}

/* ================================================================= AUTH */
$('#loginForm').addEventListener('submit', async e=>{
  e.preventDefault(); const msg=$('#lgMsg'); msg.textContent='Entrando...'; msg.className='login-msg';
  try{
    const r=await api('/api/login',{method:'POST',body:{login:$('#lgUser').value.trim(),senha:$('#lgPass').value}});
    S.token=r.token; localStorage.setItem('chm_token',S.token); S.user=r.user;
    msg.textContent=''; await boot();
  }catch(err){ msg.textContent=err.message; msg.className='login-msg err'; }
});
$('#lgForgot').addEventListener('click', async ()=>{
  const login=($('#lgUser').value||'').trim(); const msg=$('#lgMsg');
  if(!login){ msg.textContent='Digite seu login acima para solicitar.'; msg.className='login-msg err'; return; }
  try{
    const r=await api('/api/recuperar',{method:'POST',body:{login}});
    const jj=r.jaExistia?' (já havia uma solicitação em aberto)':'';
    msg.innerHTML='✅ Solicitação enviada ao administrador — chamado <b>#'+esc(String(r.chamado))+'</b>'+jj+'. Aguarde o envio da sua nova senha.'; msg.className='login-msg ok';
  }catch(err){ msg.textContent=err.message; msg.className='login-msg err'; }
});
$('#btnLogout').addEventListener('click', async ()=>{
  try{ await api('/api/logout',{method:'POST'}); }catch{}
  S.token=''; localStorage.removeItem('chm_token'); if(refreshTimer)clearInterval(refreshTimer);
  location.reload();
});

async function refreshState(){
  const r=await api('/api/state'); S.user=r.user; S.usuarios=r.usuarios; S.departamentos=r.departamentos||[]; S.chamados=r.chamados||[]; S.serverTime=r.serverTime;
  if(r.versao!==undefined) ultimaVersao=r.versao;
  computeNotifs(); if(document.querySelector('#app:not(.hidden)') && !window.__tourActive) render();
}

/* ================================================== SINCRONIA
   O app NAO rebaixa o estado inteiro de tempos em tempos. Ele atualiza:
     1) na hora, a cada acao sua (abrir, comentar, mudar status, cadastrar);
     2) quando a janela volta ao foco / a aba fica visivel;
     3) no botao 🔄 Atualizar da barra de cima;
     4) por uma checagem MINIMA (/api/versao devolve so um numero) — e o que
        permite avisar de chamado novo aberto por OUTRA pessoa. Sem ela nao
        existe notificacao, porque o servidor local nao consegue empurrar nada.
   O estado completo so vem quando esse numero muda de verdade.              */
const CHECK_MS=10000;
let ultimaVersao=null;
function vigiarLigado(){ return localStorage.getItem('chm_vigia')!=='off'; }
async function checarNovidades(){
  if(!S.token || !S.user) return;
  try{
    const r=await api('/api/versao');
    if(ultimaVersao===null){ ultimaVersao=r.v; return; }
    if(r.v!==ultimaVersao) await refreshState();
  }catch(e){}
}
async function atualizarAgora(manual){
  const b=$('#btnAtualizar'); if(b) b.classList.add('girando');
  try{
    const antes=S.chamados.length;
    await refreshState();
    if(manual){ const dif=S.chamados.length-antes; toast('Atualizado','ok', dif>0?`${dif} chamado(s) novo(s).`:'Tudo em dia.'); }
  }catch(err){ if(manual) toast('Não consegui atualizar','err',err.message); }
  finally{ setTimeout(()=>{ const x=$('#btnAtualizar'); if(x)x.classList.remove('girando'); },600); }
}
window.addEventListener('focus',()=>{ if(vigiarLigado()) checarNovidades(); });
document.addEventListener('visibilitychange',()=>{ if(!document.hidden && vigiarLigado()) checarNovidades(); });
async function boot(){
  await refreshState();
  $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');
  $('#sbNome').textContent=S.user.nome; $('#sbCargo').textContent=S.user.cargo;
  $('#sbAvatar').textContent=initials(S.user.nome);
  buildNav(); render();
  if(refreshTimer)clearInterval(refreshTimer);
  refreshTimer=setInterval(()=>{ if(vigiarLigado()) checarNovidades(); }, CHECK_MS);
  setInterval(tickLive, 1000);
  try{ buildMobileChrome(); }catch(e){}
  try{ if(!window.__mqBound){ window.__mqBound=true; window.matchMedia('(max-width:680px)').addEventListener('change',()=>{ if(S.user) render(); }); } }catch(e){}
  try{ if(ALERTA.win && notifStatus()==='default') pedirPermissaoNotif(true); }catch(e){}
  if(S.user.mustReset) openTrocarSenha(true);

function openTrocarSenha(force){
  const html=`<div class="modal-head"><h3>🔒 ${force?'Crie sua senha pessoal':'Trocar minha senha'}</h3>${force?'':'<button class="close-x" data-close>×</button>'}</div>

    <div class="field"><label>Confirmar nova senha</label><input id="tsConf" type="password" autocomplete="new-password"></div>
  </div>
  <div class="modal-foot">${force?'':'<button class="btn ghost" data-close>Cancelar</button>'}<button class="btn" id="tsSalvar">Salvar senha</button></div>`;

    const n=$('#tsNova').value, c=$('#tsConf').value;

  };

}

/* -------- LISTA -------- */
function matchFilter(c){
  const k=criticidade(c);
  switch(listFilter){
    case 'todos':return true;
    case 'Aberto':return c.status==='Aberto';
    case 'Em Atendimento':return c.status==='Em Atendimento';
    case 'encerrados':return isFinal(c);
    case 'criticos':return !isFinal(c)&&k==='critico';
    case 'medios':return !isFinal(c)&&k==='medio';
    case 'normais':return !isFinal(c)&&k==='normal';
    case 'hoje':return sameDay(c.criadoEm,agora());
    case 'semana':return withinDays(c.criadoEm,7);
    case 'mes':return sameMonth(c.criadoEm,agora());
    case 'favoritos':return (c.favoritos||[]).includes(S.user.id);
    default:return true;
  }
}
function sameDay(iso,d){ const a=new Date(iso); return a.getFullYear()===d.getFullYear()&&a.getMonth()===d.getMonth()&&a.getDate()===d.getDate(); }
function sameMonth(iso,d){ const a=new Date(iso); return a.getFullYear()===d.getFullYear()&&a.getMonth()===d.getMonth(); }
function withinDays(iso,n){ return (agora()-new Date(iso))<=n*86400000; }
function searchMatch(c){
  if(!listSearch) return true; const q=listSearch.toLowerCase();
  return [c.numero,c.titulo,c.solicitanteNome,c.responsavelNome,c.assunto,c.status,c.prioridade,c.relato]
    .some(x=>String(x==null?'':x).toLowerCase().includes(q));
}
function renderChamados(v){
  const chips=[['todos','Todos'],['Aberto','Abertos'],['Em Atendimento','Em Atendimento'],['encerrados','Encerrados'],
    ['criticos','Críticos'],['medios','Médios'],['normais','Normais'],['hoje','Hoje'],['semana','Esta Semana'],['mes','Este Mês'],['favoritos','★ Favoritos']];
  let arr=visiveis().filter(c=>matchFilter(c)&&searchMatch(c));
  arr.sort((a,b)=>{
    let x=a[listSort.key], y=b[listSort.key];
    if(listSort.key==='dias'){ x=msAberto(a); y=msAberto(b); }
    if(listSort.key==='criadoEm'||listSort.key==='atualizadoEm'){ x=new Date(x); y=new Date(y); }
    if(listSort.key==='crit'){ x=({normal:0,medio:1,critico:2})[criticidade(a)]; y=({normal:0,medio:1,critico:2})[criticidade(b)]; }
    if(typeof x==='string'){ x=x.toLowerCase(); y=(y||'').toLowerCase(); }
    return (x>y?1:x<y?-1:0)*listSort.dir;
  });
  const th=(k,l)=>`<th data-sort="${k}">${l}${listSort.key===k?(listSort.dir>0?' ▲':' ▼'):''}</th>`;
  const rows=arr.length?arr.map(c=>{
    const k=criticidade(c), fav=(c.favoritos||[]).includes(S.user.id);
    return `<tr data-open="${c.numero}">
      <td class="num">#${c.numero}</td>
      <td class="tw"><button class="star ${fav?'on':''}" data-fav="${c.numero}" title="Favoritar">${fav?'★':'☆'}</button></td>
      <td class="td-title">${esc(c.titulo)}<div style="font-size:11.5px;color:var(--muted);font-weight:400">${esc(c.assunto)}</div></td>
      <td>${esc(c.solicitanteNome)}</td>
      <td>${esc(c.responsavelNome||respLabel(c))}</td>
      <td><span class="pill dot ${stKey(c.status)}">${c.status}</span></td>
      <td><span class="pill ${prKey(c.prioridade)}">${c.prioridade}</span></td>
      <td><b class="live-days" data-c="${c.numero}"></b></td>
      <td><span class="pill cr-${k}"><span class="crdot ${k}"></span>${critLabel(k)}</span></td>
      <td>${fmtDay(c.criadoEm)}</td>
      <td>${fmtDate(c.atualizadoEm)}</td>
      <td class="no-print"><button class="btn sm subtle" data-open="${c.numero}">Abrir</button></td>
    </tr>`;
  }).join(''):`<tr><td colspan="12"><div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg><div>Nenhum chamado encontrado com esses filtros.</div></div></td></tr>`;
  v.innerHTML=`
    <div class="toolbar no-print">
      <div class="chips">${chips.map(([k,l])=>`<button class="chip ${listFilter===k?'active':''}" data-chip="${k}">${l}</button>`).join('')}</div>
      <div style="flex:1"></div>
      <button class="btn sm subtle" id="btnCsv">⤓ Excel/CSV</button>
      <button class="btn sm subtle" id="btnPrintList">🖨 Imprimir</button>
    </div>
    <div class="tablewrap"><table>
      <thead><tr>${th('numero','Nº')}<th></th>${th('titulo','Título')}${th('solicitanteNome','Solicitante')}${th('responsavelNome','Responsável')}${th('status','Status')}${th('prioridade','Prioridade')}${th('dias','Dias')}${th('crit','Criticidade')}${th('criadoEm','Abertura')}${th('atualizadoEm','Atualização')}<th class="no-print">Ações</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
    <div style="margin-top:10px;color:var(--muted);font-size:12.5px">${arr.length} chamado(s)</div>`;
}

function mAvatar(c){

  const soft={critico:'rgba(239,68,68,.14)',medio:'rgba(245,158,11,.15)',normal:'rgba(34,197,94,.14)'}[k];

  return `<div class="mrav" style="background:${soft};color:${col}">${initials(c.solicitanteNome)}<span class="cd" style="background:${dot}"></span></div>`;
}
function mStatusShort(s){ return String(s).replace('Aguardando Resposta','Aguardando').replace('Em Atendimento','Em Atend.'); }

/* -------- GERENCIAL -------- */
function bars(data){
  const max=Math.max(1,...data.map(d=>d.value));
  return data.map(d=>`<div class="bar-row"><div class="bl" title="${esc(d.label)}">${esc(d.label)}</div>
    <div class="bar-track"><div class="bar-fill" style="width:${d.value/max*100}%;background:${d.color||'var(--accent)'}">${d.value||''}</div></div></div>`).join('')
    || '<div class="empty" style="padding:20px">Sem dados.</div>';
}
function groupCount(arr,fn){ const m={}; arr.forEach(c=>{const k=fn(c);if(k==null)return;m[k]=(m[k]||0)+1;}); return m; }
function viewGerencial(){
  const cs=visiveis();
  const porResp=groupCount(cs,c=>c.responsavelNome||respLabel(c));
  const porPri=PRIORIDADES.map(p=>({label:p,value:cs.filter(c=>c.prioridade===p).length,color:pcolor(p)}));
  const porStatusObj=STATUSES.map(s=>({label:s,value:cs.filter(c=>c.status===s).length,color:scolor(s)}));
  const porMes=groupCount(cs,c=>{const d=new Date(c.criadoEm);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');});
  const consultores=S.usuarios.filter(u=>u.perfil==='consultor');
  const gestores=S.usuarios.filter(u=>u.perfil==='gestor'||u.perfil==='adm');
  const porConsultor=consultores.map(u=>({label:u.nome,value:cs.filter(c=>c.solicitanteId===u.id).length}));
  const porGestor=gestores.map(u=>({label:u.nome+(u.perfil==='adm'?' (ADM)':''),value:cs.filter(c=>c.solicitanteId===u.id||c.responsavelId===u.id).length,color:'#7c3aed'}));
  const resolvidos=cs.filter(isFinal);
  const tmedio=resolvidos.length?Math.round(resolvidos.reduce((s,c)=>s+msAberto(c),0)/resolvidos.length/3600000):0;
  const toArr=o=>Object.entries(o).map(([label,value])=>({label,value})).sort((a,b)=>b.value-a.value);
  // donut status
  const totalSt=porStatusObj.reduce((s,d)=>s+d.value,0)||1;
  let acc=0; const segs=porStatusObj.filter(d=>d.value).map(d=>{const a=acc/totalSt*360;acc+=d.value;const b=acc/totalSt*360;return `${d.color} ${a}deg ${b}deg`;}).join(',');
  const donut=`<div class="donut-wrap"><div class="donut" style="background:conic-gradient(${segs||'var(--surface-2) 0deg 360deg'})"></div>
    <div class="donut-legend">${porStatusObj.map(d=>`<div class="leg"><span class="sw" style="background:${d.color}"></span>${d.label}<b>${d.value}</b></div>`).join('')}</div></div>`;
  return `<div class="grid2">
    <div class="panel"><h3>👥 Chamados por responsável</h3><div class="body">${bars(toArr(porResp).map(d=>({...d,color:'var(--accent)'})))}</div></div>
    <div class="panel"><h3>🚦 Chamados por prioridade</h3><div class="body">${bars(porPri)}</div></div>
    <div class="panel"><h3>📊 Chamados por status</h3><div class="body">${donut}</div></div>
    <div class="panel"><h3>📅 Quantidade por mês</h3><div class="body">${bars(toArr(porMes).sort((a,b)=>a.label>b.label?1:-1).map(d=>({...d,color:'var(--blue)'})))}</div></div>
    <div class="panel"><h3>🧑‍💼 Quantidade por consultor</h3><div class="body">${bars(porConsultor.sort((a,b)=>b.value-a.value).map(d=>({...d,color:'var(--green)'})))}</div></div>
    <div class="panel"><h3>🎖 Quantidade por gestor / ADM</h3><div class="body">${bars(porGestor.sort((a,b)=>b.value-a.value))}</div></div>
    <div class="panel" style="grid-column:1/-1"><h3>⏱ Tempo médio de resolução</h3><div class="body"><div style="font-size:30px;font-weight:800">${tmedio} h <span style="font-size:14px;font-weight:600;color:var(--muted)">(${resolvidos.length} chamados finalizados)</span></div></div></div>
  </div>`;
}
function pcolor(p){ return {'Baixa':'#94a3b8','Média':'var(--blue)','Alta':'var(--amber)','Urgente':'var(--red)'}[p]; }
function scolor(s){ return {'Aberto':'#2563eb','Em Atendimento':'#4f46e5','Aguardando Resposta':'#d97706','Resolvido':'#16a34a','Encerrado':'#94a3b8'}[s]; }

/* -------- INDICADORES -------- */
function firstAtendMs(c){
  const h=(c.historico||[]).find(x=>x.acao&&x.acao.includes('Em Atendimento'));
  return h?new Date(h.quando)-new Date(c.criadoEm):null;
}
function viewIndicadores(){
  const cs=visiveis(); const resolvidos=cs.filter(isFinal); const ativos=cs.filter(c=>!isFinal(c));
  const atendMs=cs.map(firstAtendMs).filter(x=>x!=null);
  const tAtend=atendMs.length?Math.round(atendMs.reduce((a,b)=>a+b,0)/atendMs.length/3600000):0;
  const tResol=resolvidos.length?Math.round(resolvidos.reduce((s,c)=>s+msAberto(c),0)/resolvidos.length/3600000):0;
  const criticos=ativos.filter(c=>criticidade(c)==='critico').length;
  const encMes=resolvidos.filter(c=>sameMonth(c.atualizadoEm||c.criadoEm,agora())).length;
  const pendentes=ativos.length;
  const atrasados=ativos.filter(c=>diasAberto(c)>=4).length;
  const kpi=(n,l,s,cls)=>`<div class="kpi"><div class="n" style="color:${cls}">${n}</div><div class="l">${l}</div><div class="s">${s}</div></div>`;
  return `<div class="kpi-grid">
    ${kpi(tAtend+'h','Tempo médio de atendimento','Da abertura ao 1º atendimento','var(--accent)')}
    ${kpi(tResol+'h','Tempo médio de resolução','Da abertura ao encerramento','var(--green)')}
    ${kpi(criticos,'Chamados críticos','Ativos há 4+ dias','var(--red)')}
    ${kpi(encMes,'Encerrados no mês','Competência atual','var(--green)')}
    ${kpi(pendentes,'Chamados pendentes','Ainda não finalizados','var(--blue)')}
    ${kpi(atrasados,'Chamados atrasados','SLA estourado (4+ dias)','var(--red)')}
  </div>`;
}

async function salvarDep(body){
  try{ const r=await api('/api/departamento',{method:'POST',body}); S.departamentos=r.departamentos; render(); toast('Departamento salvo','ok'); }
  catch(err){ toast('Erro','err',err.message); }
}
async function excluirDep(id){
  const d=(S.departamentos||[]).find(x=>x.id===id); if(!d) return;
  if(!confirm(`Excluir o departamento "${d.nome}"?`)) return;
  try{ const r=await api('/api/departamento/excluir',{method:'POST',body:{id}}); S.departamentos=r.departamentos; render(); toast('Departamento excluído','ok'); }
  catch(err){ toast('Não foi possível excluir','err',err.message); }
}

/* ================================================================= EVENTS pós-render */
function bindViewEvents(){
  document.querySelectorAll('[data-open]').forEach(e=>e.onclick=ev=>{ev.stopPropagation();openDetalhe(+e.getAttribute('data-open'));});
  document.querySelectorAll('[data-fav]').forEach(b=>b.onclick=ev=>{ev.stopPropagation();toggleFav(+b.getAttribute('data-fav'));});
  document.querySelectorAll('.stat[data-act]').forEach(s=>s.onclick=()=>{const a=s.getAttribute('data-act');if(!a)return;listFilter=a;route='chamados';buildNav();render();});
  document.querySelectorAll('[data-chip]').forEach(c=>c.onclick=()=>{listFilter=c.getAttribute('data-chip');render();});
  document.querySelectorAll('th[data-sort]').forEach(t=>t.onclick=()=>{const k=t.getAttribute('data-sort');if(listSort.key===k)listSort.dir*=-1;else listSort={key:k,dir:1};render();});
  const csv=$('#btnCsv'); if(csv)csv.onclick=exportCsv;
  const pl=$('#btnPrintList'); if(pl)pl.onclick=()=>window.print();
  const fo=$('#filaOrd'); if(fo)fo.onchange=()=>reorderFila(fo.value);
  const nu=$('#btnNovoUser'); if(nu)nu.onclick=()=>openUser(null);
  document.querySelectorAll('[data-edituser]').forEach(b=>b.onclick=()=>openUser(b.getAttribute('data-edituser')));
  const bd=$('#btnDepNovo'); if(bd)bd.onclick=()=>{ const i=$('#depNovoNome'); const n=(i.value||'').trim(); if(!n){ toast('Digite o nome do departamento','err'); return; } salvarDep({nome:n}); };
  const di=$('#depNovoNome'); if(di)di.addEventListener('keydown',e=>{ if(e.key==='Enter')$('#btnDepNovo').click(); });
  document.querySelectorAll('[data-depopen]').forEach(tr=>tr.onclick=()=>{ const id=tr.getAttribute('data-depopen'); depAberto=(depAberto===id)?null:id; render(); });
  document.querySelectorAll('[data-depedit]').forEach(b=>b.onclick=ev=>{ ev.stopPropagation(); const d=S.departamentos.find(x=>x.id===b.getAttribute('data-depedit')); const n=prompt('Novo nome do departamento:',d?d.nome:''); if(n&&n.trim()) salvarDep({id:d.id,nome:n.trim()}); });
  document.querySelectorAll('[data-deptoggle]').forEach(b=>b.onclick=ev=>{ ev.stopPropagation(); const d=S.departamentos.find(x=>x.id===b.getAttribute('data-deptoggle')); if(d) salvarDep({id:d.id,nome:d.nome,ativo:!d.ativo}); });
  document.querySelectorAll('[data-depdel]').forEach(b=>b.onclick=ev=>{ ev.stopPropagation(); excluirDep(b.getAttribute('data-depdel')); });
  document.querySelectorAll('[data-mall]').forEach(a=>a.onclick=()=>go('chamados'));
}
function reorderFila(mode){
  let arr=visiveis().filter(c=>!isFinal(c));
  if(mode==='prioridade'){const o={'Urgente':0,'Alta':1,'Média':2,'Baixa':3};arr.sort((a,b)=>o[a.prioridade]-o[b.prioridade]||new Date(a.criadoEm)-new Date(b.criadoEm));}
  else if(mode==='responsavel')arr.sort((a,b)=>(a.responsavelNome||respLabel(a)).localeCompare(b.responsavelNome||respLabel(b)));
  else if(mode==='crit'){const o={critico:0,medio:1,normal:2};arr.sort((a,b)=>o[criticidade(a)]-o[criticidade(b)]);}
  else arr.sort((a,b)=>new Date(a.criadoEm)-new Date(b.criadoEm));
  const wrap=$('#filaList');
  wrap.innerHTML=arr.map((c,i)=>{const k=criticidade(c);return `<div class="fila-item ${k}" data-open="${c.numero}"><div class="fila-pos">${i+1}º</div><div class="fila-main"><b>#${c.numero} · ${esc(c.titulo)}</b><small>${esc(c.solicitanteNome)} · ${esc(c.assunto)} · aberto há <b class="live-days" data-c="${c.numero}"></b></small></div><span class="pill ${prKey(c.prioridade)}">${c.prioridade}</span><span class="pill ${stKey(c.status)}">${c.status}</span><span class="pill cr-${k}"><span class="crdot ${k}"></span>${critLabel(k)}</span></div>`;}).join('')||'<div class="empty">🎉 Fila vazia.</div>';
  document.querySelectorAll('#filaList [data-open]').forEach(e=>e.onclick=()=>openDetalhe(+e.getAttribute('data-open')));
  tickLive();
}

/* live counters (1s) */
function tickLive(){
  const map={}; visiveis().forEach(c=>map[c.numero]=c);
  document.querySelectorAll('.live-days').forEach(e=>{
    const c=map[+e.getAttribute('data-c')]; if(!c)return;
    e.textContent=liveStr(c); const k=criticidade(c);
    e.style.color=k==='critico'?'var(--red)':k==='medio'?'var(--amber)':'var(--green)';
  });
}

/* --- Colar dados: preenche o bloco automaticamente --- */
function parsePasted(text){
  const KW=[['nome',/nome/i],['nascimento',/nascimento|nasc\b|data de nasc/i],['telefone',/telefone|celular|whats|\bfone\b|\btel\b/i],['estado',/estado|\buf\b/i],['cidade',/cidade/i],['bairro',/bairro/i],['cpf',/cpf/i],['cargo',/cargo|profiss/i],['email',/e-?mail/i],['endereco',/endere|logradouro|\brua\b/i],['cep',/cep/i],['patologia',/patolog|doen|sa[úu]de/i],['pagamento',/pagamento|forma de pag/i]];
  const res={};
  String(text||'').split(/\r?\n/).forEach(line=>{
    const l=line.replace(/^\s*\d{1,2}\s*[.)\-º:]*\s*/,'').trim();
    const ci=l.indexOf(':'); if(ci<0) return;
    const label=l.slice(0,ci), val=l.slice(ci+1).trim(); if(!val) return;
    for(const [key,re] of KW){ if(res[key]===undefined && re.test(label)){ res[key]=val; break; } }
  });
  return res;
}
function fillBlockFromText(blockId,text){
  const parsed=parsePasted(text); let n=0;
  FAST_FIELDS.forEach(f=>{
    if(parsed[f.k]===undefined) return;
    let v=parsed[f.k];
    const inp=document.querySelector(`#fastBlocks [data-block="${blockId}"][data-fk="${f.k}"]`);
    if(!inp) return;
    if(f.k==='nascimento'){ const m=v.match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/); if(m){ let y=m[3]; if(y.length===2)y='19'+y; v=y.padStart(4,'0')+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0'); } }
    if(inp.tagName==='SELECT'){ const o=[...inp.options].find(o=>o.text.toLowerCase()===String(v).toLowerCase()||o.text.toLowerCase().includes(String(v).toLowerCase())); if(o){inp.value=o.value;n++;} }
    else { inp.value=applyMask(f.k,v); n++; }
  });
  return n;
}
/* máscaras CPF / telefone / CEP */
function maskCPF(v){ v=String(v).replace(/\D/g,'').slice(0,11); if(v.length>9)return v.replace(/(\d{3})(\d{3})(\d{3})(\d{1,2})/,'$1.$2.$3-$4'); if(v.length>6)return v.replace(/(\d{3})(\d{3})(\d{1,3})/,'$1.$2.$3'); if(v.length>3)return v.replace(/(\d{3})(\d{1,3})/,'$1.$2'); return v; }
function maskTel(v){ v=String(v).replace(/\D/g,'').slice(0,11); const d=v.length; if(d===0)return ''; if(d<3)return '('+v; if(d<7)return '('+v.slice(0,2)+') '+v.slice(2); if(d<11)return '('+v.slice(0,2)+') '+v.slice(2,6)+'-'+v.slice(6); return '('+v.slice(0,2)+') '+v.slice(2,7)+'-'+v.slice(7); }
function maskCEP(v){ v=String(v).replace(/\D/g,'').slice(0,8); if(v.length>5)return v.slice(0,5)+'-'+v.slice(5); return v; }
function applyMask(fk,value){ return fk==='cpf'?maskCPF(value):fk==='telefone'?maskTel(value):fk==='cep'?maskCEP(value):value; }
function bindFastMask(){
  document.querySelectorAll('#fastBlocks input[data-fk="cpf"],#fastBlocks input[data-fk="telefone"],#fastBlocks input[data-fk="cep"]').forEach(inp=>{
    const fk=inp.getAttribute('data-fk');
    inp.oninput=()=>{ inp.value=applyMask(fk,inp.value); };
  });
}

function fastRestore(s){ document.querySelectorAll('#fastBlocks [data-fk]').forEach(i=>{ const k=i.getAttribute('data-block')+'.'+i.getAttribute('data-fk'); if(s[k]!==undefined)i.value=s[k]; }); }

          if(f.req && !val && !missing) missing={block:b.t,id:b.id,field:(i+1)+'. '+f.label};
        });
        data[b.id]={t:b.t,existe:false,fields:bd};
      }
    });
    if(missing){ const el=document.querySelector(`#fastBlocks [data-block="${missing.id}"]`); const blk=el?el.closest('.fast-block'):null; if(blk){ const g=blk.querySelector('.fast-grid'), tg=blk.querySelector('[data-ftoggle]'); if(g&&g.hasAttribute('hidden')){ g.removeAttribute('hidden'); if(tg)tg.textContent='▾ Ocultar campos'; } } toast('Faltou preencher','err',missing.block+' — '+missing.field); return; }
    blocks.forEach(b=>{
      const d=data[b.id];
      if(d.existe){ relato+=`\n━━━ ${d.t.toUpperCase()} · JÁ CADASTRADO NO ZS ━━━\nCPF: ${d.fields.cpf}\n`; }

    });
    const nomes=blocks.map(b=>data[b.id].fields.nome).filter(Boolean);
    const extraTit=(assunto===PROD&&prodObj)?(' — '+prodObj.n):(vagas==='outro'?' — Caso específico':'');
    titulo=assunto+extraTit+(nomes.length?(' — '+nomes.join(' ▸ ')):'');
    fastData={assunto,vagas,produto,link,relato:relatoSol,existe:fastExisteMap,blocks:data};
  }
  const c={
    numero:0, titulo, assunto, relato, prioridade:'Alta', status:'Aberto',
    responsavelPerfil:tgt.perfil, responsavelId:tgt.id, responsavelNome:tgt.nome,

    comentarios:[], fast:fastData
  };
  const btn=$('#fSalvar'); btn.disabled=true; btn.textContent='Abrindo...';
  try{
    const saved=await api('/api/chamado',{method:'POST',body:c});

let detNum=null, detAnexos=[];
/* ============================ CHAMADO FECHADO =============================
   Resolvido/Encerrado nao aceitam mais nada. A continuacao e um chamado NOVO
   vinculado ao antigo, herdando ASSUNTO e RECEPTOR. Reabertura so em chamado
   Encerrado, e mesmo assim depende do ADM aprovar.                          */
const HORAS_P_ENCERRAR=24;
function quemFechou(c){
  /* aceita tambem o detalhe do servidor: "Resolvido -> Encerrado (automatico apos 24 horas)" */
  const hs=(c.historico||[]).filter(h=>h.acao==='Status alterado' && /(Resolvido|Encerrado)\s*(\([^)]*\))?\s*$/.test(String(h.detalhe||'')));
  const u=hs[hs.length-1];
  return u?{quem:u.usuarioNome,quando:u.quando}:{quem:'—',quando:c.atualizadoEm};
}
function horasParaEncerrar(c){
  const h=(agora()-new Date(c.atualizadoEm))/3600000;
  return Math.max(0,Math.ceil(HORAS_P_ENCERRAR-h));
}
function faixaFechado(c){
  if(!isFinal(c)) return '';
  const f=quemFechou(c), enc=c.status==='Encerrado';
  const pend=c.reabertura&&c.reabertura.situacao==='pendente';
  const restam=horasParaEncerrar(c);
  return `<div class="trava ${enc?'enc':''} no-print">
    <span class="ic">🔒</span>
    <div><b>Chamado ${enc?'encerrado':'resolvido'} em ${fmtDate(f.quando)} por ${esc(f.quem)}</b>
      <small>${enc
        ? 'Este chamado está fechado e não recebe mais alterações.'
        : `Não recebe mais alterações. Encerra automaticamente ${restam>0?('em '+restam+' hora(s)'):'a qualquer momento'}.`}</small></div>
    <div class="acoes">
      <button class="btn sm" id="detVinc">🔗 Abrir chamado vinculado</button>
      ${(!enc&&isAdm())?'<button class="btn sm subtle" id="detEncerrar">✖ Encerrar agora</button>':''}
      ${(enc&&!pend)?'<button class="btn sm subtle" id="detReab">🔓 Solicitar reabertura</button>':''}
    </div></div>`;
}
function vinculosHtml(c){
  const partes=[];
  if(c.vinculadoA) partes.push(`🔗 Continuação do <a href="#" data-irpara="${c.vinculadoA}">#${c.vinculadoA}</a>`);
  const fs=(c.vinculos||[]);
  if(fs.length) partes.push(`🔗 Gerou ${fs.map(n=>`<a href="#" data-irpara="${n}">#${n}</a>`).join(' · ')}`);
  return partes.length?`<div class="vinc-faixa">${partes.join(' &nbsp;·&nbsp; ')}</div>`:'';
}
function cardReabertura(c){
  const r=c.reabertura; if(!r) return '';
  if(r.situacao==='pendente'){

/* ================================================== ALERTAS (som + Windows)
   Avisa ATIVAMENTE quem tem que agir:
     - chamado novo  -> o RECEPTOR (responsavel nominal, ou o perfil de destino)
     - status/comentario -> o SOLICITANTE e o responsavel (menos quem clicou)
   Camadas: som (WebAudio, sem arquivo) + toast + notificacao nativa do Windows
   + titulo da aba piscando. A notificacao nativa so existe em contexto seguro
   (localhost ou HTTPS) — por http://IP:8790 o navegador bloqueia a API.        */
const ALERTA={ som:localStorage.getItem('chm_som')!=='off', win:localStorage.getItem('chm_win')!=='off',
               desde:0, ctx:null, base:document.title, pisca:null };

function ehResponsavel(c){
  if(c.responsavelId) return c.responsavelId===S.user.id;
  if(c.responsavelPerfil){                       // sem nome: vale o perfil de destino
    if(c.responsavelPerfil===S.user.perfil) return true;
    return c.responsavelPerfil==='gestor' && isAdm();   // o ADM responde pelo gestor
  }
  return isManager();
}
function ehSolicitante(c){ return c.solicitanteId===S.user.id; }
function stEmoji(s){ return {'Em Atendimento':'▶','Aguardando Resposta':'⏸','Resolvido':'✔','Encerrado':'✖','Aberto':'🎫'}[s]||'↻'; }

/* ---- som: 3 bips subindo p/ chamado novo, 2 bips curtos p/ atualizacao ---- */
function audioCtx(){
  if(ALERTA.ctx) return ALERTA.ctx;
  const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return null;
  try{ ALERTA.ctx=new AC(); }catch(e){ return null; }
  return ALERTA.ctx;
}
function tocarSom(tipo){
  if(!ALERTA.som) return;
  const ac=audioCtx(); if(!ac) return;
  try{ if(ac.state==='suspended') ac.resume(); }catch(e){}
  const seq={ novo:[[880,0,.16],[1174,.19,.16],[1568,.38,.34]],
              fim:[[1046,0,.14],[784,.16,.26]],
              update:[[784,0,.11],[1046,.13,.18]] }[tipo]||[[880,0,.14]];
  const t0=ac.currentTime+.02;
  seq.forEach(([f,at,dur])=>{
    const o=ac.createOscillator(), g=ac.createGain();
    o.type='sine'; o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,t0+at);
    g.gain.exponentialRampToValueAtTime(.28,t0+at+.02);
    g.gain.exponentialRampToValueAtTime(.0001,t0+at+dur);
    o.connect(g); g.connect(ac.destination); o.start(t0+at); o.stop(t0+at+dur+.03);
  });
}
/* destrava o audio no 1o gesto do usuario (politica de autoplay) */
['click','keydown','touchstart'].forEach(ev=>window.addEventListener(ev,()=>{ try{ const a=audioCtx(); if(a&&a.state==='suspended')a.resume(); }catch(e){} },{once:true}));

/* ---- notificacao nativa do Windows ---- */
function podeNotificar(){ return ('Notification' in window) && window.isSecureContext; }
function notifStatus(){
  if(!('Notification' in window)) return 'sem-suporte';
  if(!window.isSecureContext) return 'inseguro';
  return Notification.permission;                 // default | granted | denied
}
async function pedirPermissaoNotif(silencioso){
  if(!podeNotificar()){ if(!silencioso) toast('Indisponível aqui','err','A notificação do Windows exige localhost ou HTTPS.'); return false; }
  if(Notification.permission==='granted') return true;
  if(Notification.permission==='denied'){ if(!silencioso) toast('Bloqueado no navegador','err','Libere as notificações deste site no cadeado da barra de endereço.'); return false; }
  try{ const p=await Notification.requestPermission(); return p==='granted'; }catch(e){ return false; }
}
function notificar(titulo,corpo,numero){
  if(!ALERTA.win || !podeNotificar() || Notification.permission!=='granted') return;
  const opt={ body:corpo, icon:'/icon-192.png', badge:'/favicon.png', tag:'chm-'+numero, renotify:true, requireInteraction:false };
  try{
    const n=new Notification(titulo,opt);
    n.onclick=()=>{ try{ window.focus(); }catch(e){} pararPisca(); openDetalhe(numero); n.close(); };
  }catch(e){                                      // Android/Chrome exige o service worker
    try{ navigator.serviceWorker.ready.then(r=>r.showNotification(titulo,opt)).catch(()=>{}); }catch(e2){}
  }
}
/* ---- titulo da aba piscando ---- */
function pararPisca(){ if(ALERTA.pisca){ clearInterval(ALERTA.pisca); ALERTA.pisca=null; } document.title=ALERTA.base; }
function piscaTitulo(qtd){
  pararPisca();
  let on=false, voltas=0;
  ALERTA.pisca=setInterval(()=>{
    on=!on; voltas++;
    document.title = on ? `🔔 (${qtd}) chamado precisa de você` : ALERTA.base;
    if(voltas>80) pararPisca();                   // ~1 min e para sozinho
  },800);
  window.addEventListener('focus',pararPisca,{once:true});
}

/* ---- o que vira alerta para ESTE usuario ---- */
function eventosAlerta(){
  const out=[];
  visiveis().forEach(c=>{
    const resp=ehResponsavel(c), sol=ehSolicitante(c);
    if(resp && !sol) out.push({ ts:+new Date(c.criadoEm), numero:c.numero, som:'novo',
      titulo:`🎫 Novo chamado #${c.numero}`, corpo:`${c.titulo} — de ${c.solicitanteNome} · ${c.prioridade}` });
    (c.historico||[]).forEach(h=>{
      if(h.usuarioId===S.user.id || h.acao!=='Status alterado' || !(resp||sol)) return;
      /* front grava "A → B"; servidor grava "A -> B (automatico apos 24 horas)" */
      const st=String(h.detalhe||'').split(/→|->/).pop().replace(/\([^)]*\)\s*$/,'').trim();
      out.push({ ts:+new Date(h.quando), numero:c.numero, som:FINALIZADOS.includes(st)?'fim':'update',
        titulo:`${stEmoji(st)} #${c.numero} · ${st||'status alterado'}`, corpo:`${c.titulo} — por ${h.usuarioNome}` });
    });
    (c.comentarios||[]).forEach(cm=>{
      if(cm.usuarioId===S.user.id || !(resp||sol)) return;
      if(cm.interno && !isManager()) return;
      out.push({ ts:+new Date(cm.quando), numero:c.numero, som:'update',
        titulo:`💬 #${c.numero} · novo comentário`, corpo:`${cm.usuarioNome}: ${String(cm.texto||'').slice(0,90)}` });
    });
  });
  return out.sort((a,b)=>a.ts-b.ts);
}
function dispararAlertas(){
  const evs=eventosAlerta();
  const ultimo=evs.length?evs[evs.length-1].ts:Date.now();
  if(ALERTA.desde===0){ ALERTA.desde=ultimo; return; }   // 1a carga nao alerta o passado
  const novos=evs.filter(e=>e.ts>ALERTA.desde);
  if(!novos.length) return;
  ALERTA.desde=novos[novos.length-1].ts;
  const forte=novos.some(e=>e.som==='novo');
  tocarSom(forte?'novo':novos[novos.length-1].som);
  novos.slice(-3).forEach(e=>{ toast(e.titulo,forte?'ok':'',e.corpo); notificar(e.titulo,e.corpo,e.numero); });
  if(document.hidden||forte) piscaTitulo(novos.length);
}

function exportCsv(){

  const rows=arr.map(c=>[c.numero,c.titulo,c.assunto,c.solicitanteNome,c.responsavelNome||respLabel(c),c.status,c.prioridade,diasAberto(c),critLabel(criticidade(c)),fmtDate(c.criadoEm),fmtDate(c.atualizadoEm)]);
  const csv=[head,...rows].map(r=>r.map(x=>'"'+String(x==null?'':x).replace(/"/g,'""')+'"').join(';')).join('\r\n');

        <div class="tprog"><i id="tPFill"></i></div>
        <button class="tbtn" id="tPrev" title="Voltar">⏮</button>
        <button class="tbtn pri" id="tPlay" title="Pausar">⏸</button>
        <button class="tbtn" id="tNext" title="Avançar">⏭</button>
        <button class="tbtn" id="tRestart" title="Reiniciar">🔁</button>
        <button class="tbtn" id="tVoice" title="Narração on/off">🔊</button>
        <button class="tspeed" id="tSpeed" title="Velocidade">1x</button>
        <span class="tmeta" id="tMeta">-4:00</span>
        <button class="tbtn" id="tExit" title="Sair do treinamento">✕</button>
      </div>`;
    document.body.appendChild(root);
    dim=root.querySelector('#tourDim'); spot=root.querySelector('#tourSpot');
    wrap=root.querySelector('#tourStageWrap'); stage=root.querySelector('#tourStageBody');
    card=root.querySelector('#tourCard'); pfill=root.querySelector('#tPFill'); meta=root.querySelector('#tMeta');
    elPlay=root.querySelector('#tPlay'); elVoice=root.querySelector('#tVoice'); elSpeed=root.querySelector('#tSpeed');
    root.querySelector('#tPrev').onclick=prev;
    root.querySelector('#tNext').onclick=next;
    elPlay.onclick=toggle;
    root.querySelector('#tRestart').onclick=()=>{ go(0); playing=true; setIcons(); };
    elVoice.onclick=()=>{ voiceOn=!voiceOn; elVoice.classList.toggle('off',!voiceOn); if(!voiceOn&&'speechSynthesis' in window)speechSynthesis.cancel(); };
    elSpeed.onclick=cycleSpeed;
    root.querySelector('#tExit').onclick=exit;
    window.addEventListener('resize',onResize);
    document.addEventListener('keydown',onKey,true);
  }
  function onKey(e){ if(!active)return;
    if(e.key==='Escape'){ e.preventDefault();e.stopPropagation(); exit(); }
    else if(e.code==='Space'){ e.preventDefault();e.stopPropagation(); toggle(); }
    else if(e.key==='ArrowRight'){ e.preventDefault(); next(); }
    else if(e.key==='ArrowLeft'){ e.preventDefault(); prev(); }
  }
  function onResize(){ if(active)layout(STEPS[idx]); }

  function setIcons(){ elPlay.textContent=playing?'⏸':'▶'; elSpeed.textContent=(speed+'').replace('.',',')+'x'; }
  function cycleSpeed(){ speed=SPEEDS[(SPEEDS.indexOf(speed)+1)%SPEEDS.length]; setIcons(); if(playing)say(STEPS[idx].narr||STEPS[idx].text); }

  function showStage(step){
    if(curStageKey!==step.stageKey){ stage.innerHTML=STAGES[step.stageKey](); curStageKey=step.stageKey; wireStage(step.stageKey); }
    stage.parentElement.parentElement.classList.add('on'); // wrap.on
    wrap.classList.add('on'); spot.style.display='none';
    stage.querySelectorAll('.thl').forEach(e=>e.classList.remove('thl'));
    if(step.hl){ const h=stage.querySelector(step.hl); if(h)h.classList.add('thl'); }
  }
  function hideStage(){ wrap.classList.remove('on'); curStageKey=null; }
  function wireStage(key){
    if(key==='fim'){
      const a=stage.querySelector('#tFimAgain'); if(a)a.onclick=()=>{ go(0); playing=true; setIcons(); };
      const m=stage.querySelector('#tFimManual'); if(m)m.onclick=()=>window.open('/Manual-App-Chamado.html','_blank');
      const c=stage.querySelector('#tFimClose'); if(c)c.onclick=exit;
    }
  }
  function setSpot(r){ spot.style.display='block'; spot.style.left=(r.left-8)+'px'; spot.style.top=(r.top-8)+'px'; spot.style.width=(r.width+16)+'px'; spot.style.height=(r.height+16)+'px'; }
  function positionCard(r){
    const cw=card.offsetWidth||300, ch=card.offsetHeight||120, vw=innerWidth, vh=innerHeight, m=12; let left,top;
    if(!r){ left=(vw-cw)/2; top=vh*0.60; }
    else{
      left=Math.max(m,Math.min(r.left+r.width/2-cw/2, vw-cw-m));
      if(r.bottom+ch+14 < vh-96) top=r.bottom+14;
      else if(r.top-ch-14 > 74) top=r.top-ch-14;
      else { top=Math.max(74,(vh-ch)/2-40); }
    }
    card.style.left=left+'px'; card.style.top=top+'px';
  }
  function layout(step){
    let r=null;
    if(step.stageKey){ const h=step.hl?stage.querySelector(step.hl):null; if(h)r=h.getBoundingClientRect(); }
    else if(step.target){ const t=document.querySelector(step.target); if(t){ try{t.scrollIntoView({block:'center'});}catch(e){} r=t.getBoundingClientRect(); setSpot(r); } else { spot.style.display='none'; } }
    positionCard(r);
  }

  function go(i){
    idx=Math.max(0,Math.min(STEPS.length-1,i)); clock=0; const step=STEPS[idx];
    if(step.route && route!==step.route){ route=step.route; buildNav(); render(); }
    if(step.stageKey){ showStage(step); } else { hideStage(); }
    // card
    card.innerHTML=`<div class="tc-feat">Etapa ${idx+1}/${STEPS.length} · ${step.feature}</div>
      <div class="tc-txt">${step.text}</div>
      ${step.goto?`<div class="tc-goto"><button class="btn sm subtle" id="tcGoto">➜ ${step.gotoLabel||'Ir para esta área'}</button></div>`:''}`;
    if(step.goto){ const g=card.querySelector('#tcGoto'); if(g)g.onclick=()=>{ const r=step.goto; exit(); route=r; buildNav(); render(); }; }
    requestAnimationFrame(()=>layout(step));
    say(step.narr||step.text);
    updateProgress();
  }
  function next(){ if(idx<STEPS.length-1){ go(idx+1); } else { finish(); } }
  function prev(){ if(clock>2500) go(idx); else go(Math.max(0,idx-1)); }
  function toggle(){ playing=!playing; setIcons(); if('speechSynthesis' in window){ playing?speechSynthesis.resume():speechSynthesis.pause(); } }
  function finish(){ playing=false; setIcons(); try{localStorage.setItem('chm_tour_done','1');}catch(e){} }

  function updateProgress(){
    const t=totalDur(), elapsed=before(idx)+Math.min(clock/1000,STEPS[idx].dur);
    pfill.style.width=(elapsed/t*100)+'%';
    meta.textContent='-'+fmt((t-elapsed)/Math.max(speed,0.001));
  }
  function loop(ts){ raf=requestAnimationFrame(loop); if(!playing){ last=ts; return; }
    const dt=Math.min(70,ts-last); last=ts; clock+=dt*speed;
    updateProgress();
    if(clock>=STEPS[idx].dur*1000){ next(); }
  }

  function start(){
    if(active) return;
    const boot=()=>{ if(!root)buildRoot(); root.classList.remove('hidden'); active=true; window.__tourActive=true;
      idx=0; speed=1; voiceOn=true; playing=true; elVoice.classList.remove('off'); setIcons(); go(0);
      last=performance.now(); if(!raf)raf=requestAnimationFrame(loop); };
    if(loaded){ boot(); return; }
    // tenta carregar config externa /tour.json (opcional, modular); se falhar usa a padrão
    fetch('/tour.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{ if(j&&Array.isArray(j.steps)&&j.steps.length)STEPS=j.steps; }).catch(()=>{}).finally(()=>{ loaded=true; boot(); });
  }
  function exit(){ active=false; window.__tourActive=false; playing=false; if(raf){ cancelAnimationFrame(raf); raf=null; } if('speechSynthesis' in window)speechSynthesis.cancel(); if(root)root.classList.add('hidden'); }
  return { start, exit };
})();

/* ================================================================= PWA (service worker) */
if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')){
  window.addEventListener('load',()=>{ navigator.serviceWorker.register('/sw.js').catch(()=>{}); });
}

/* ================================================================= START */
(async function(){
  if(S.token){ try{ await boot(); return; }catch{ S.token=''; localStorage.removeItem('chm_token'); } }
  $('#login').classList.remove('hidden');
})();
</script>
</body>
</html>
