<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Card - Meta Master</title>
    
    <!-- Importando fontes similares às da imagem -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Bebas+Neue&family=Montserrat:wght@300;800;900&display=swap" rel="stylesheet">
    
    <!-- Biblioteca para transformar o HTML em Imagem para baixar -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #2c2c2c;
            font-family: 'Montserrat', sans-serif;
            flex-direction: row;
            gap: 40px;
        }

        /* Controles do lado esquerdo para editar os dados */
        .controls {
            background-color: #fff;
            padding: 30px;
            border-radius: 12px;
            width: 300px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .controls h2 {
            font-size: 18px;
            margin-bottom: 10px;
            color: #333;
        }

        .controls label {
            font-size: 14px;
            font-weight: bold;
            color: #555;
        }

        .controls input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-family: inherit;
        }

        .controls button {
            background-color: #f1c447;
            color: #111;
            border: none;
            padding: 15px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
            font-size: 16px;
            margin-top: 10px;
        }

        .controls button:hover {
            background-color: #dcb340;
        }

        /* O Card propriamente dito (proporção de stories de Instagram 9:16) */
        .card-wrapper {
            position: relative;
        }

        .card {
            width: 450px;
            height: 800px;
            background: linear-gradient(180deg, #fdfff2 0%, #ffffff 40%);
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Topo com os textos */
        .header {
            text-align: center;
            margin-top: 50px;
            z-index: 2;
        }

        .meta-master {
            font-family: 'Archivo Black', sans-serif;
            font-weight: 400;
            font-size: 70px;
            line-height: 0.85;
            text-transform: uppercase;
            letter-spacing: -2px;
            /* Efeito de cor e gradiente parecido com a original */
            background: linear-gradient(to bottom right, #353d26, #14170f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .batida {
            font-weight: 300;
            font-size: 30px;
            letter-spacing: 10px;
            color: #1a1a1a;
            margin-top: 15px;
            text-transform: uppercase;
        }

        /* Container da foto do consultor */
        .photo-container {
            position: absolute;
            top: 215px;
            width: 300px;
            height: 380px;
            z-index: 3;
            border-radius: 20px;
            border: 2px solid #111;
            background-color: #f1c447; /* Amarelo exato da imagem */
            display: flex;
            justify-content: center;
            align-items: flex-end;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        /* Imagem (recorte do consultor) */
        .photo-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            /* Cobre perfeitamente o espaço do quadrado */
        }

        /* Fundo escuro curvado */
        .black-bg {
            position: absolute;
            bottom: 0;
            width: 150%;
            height: 400px;
            background-color: #1a1a1a;
            border-top-left-radius: 50% 60px;
            border-top-right-radius: 50% 60px;
            left: -25%;
            z-index: 1;
        }

        /* Nome do consultor */
        .name-banner {
            position: absolute;
            bottom: 120px;
            width: 100%;
            text-align: center;
            z-index: 4;
        }

        .name-text {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 85px;
            color: #ffffff;
            letter-spacing: 1px;
            margin: 0;
            line-height: 1;
            /* Sutil sombra pra dar profundidade */
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        /* Rodapé de logos */
        .logos-footer {
            position: absolute;
            bottom: 25px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
            z-index: 4;
        }

        /* FEBRACIS */
        .logo-febracis {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .febracis-icon svg {
            width: 25px;
            height: 25px;
            fill: white;
        }
        .febracis-text {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }
        .f-title {
            color: white;
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            font-size: 15px;
            line-height: 1;
            letter-spacing: 0.5px;
        }
        .f-sub {
            color: white;
            font-family: 'Montserrat', sans-serif;
            font-weight: 300;
            font-size: 5px;
            letter-spacing: 2px;
            margin-top: 2px;
        }

        /* FRZ GRUPO */
        .logo-frz {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .frz-title {
            color: #f1c447;
            font-family: 'Archivo Black', sans-serif;
            font-size: 38px;
            line-height: 0.9;
            letter-spacing: -2px;
            transform: scaleX(1.3);
            margin-bottom: 2px;
        }
        .frz-sub {
            color: white;
            font-family: 'Montserrat', sans-serif;
            font-weight: 300;
            font-size: 7px;
            letter-spacing: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .frz-sub .line {
            width: 28px;
            height: 1px;
            background-color: #f1c447;
        }

        /* LEADFIT */
        .logo-leadfit {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .l7-icon {
            color: white;
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 11px;
            font-style: italic;
            border: 2px solid white;
            padding: 1px 4px;
            transform: skewX(-15deg);
        }
        .leadfit-title {
            color: white;
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 18px;
            font-style: italic;
            letter-spacing: 0px;
        }
    </style>
</head>
<body>

    <!-- Painel de Controle -->
    <div class="controls">
        <h2>Painel de Edição</h2>
        
        <label for="nameInput">Nome do Consultor:</label>
        <input type="text" id="nameInput" value="DANIEL MOURA" oninput="updateName()">
        
        <label for="photoInput">Link da Foto (Fundo transparente):</label>
        <input type="text" id="photoInput" value="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/25.png" oninput="updatePhoto()" placeholder="Cole a URL da imagem aqui">

        <button onclick="downloadCard()">⬇ Baixar Imagem do Card</button>
        <small style="text-align: center; color: #777;">O design foi criado usando HTML e CSS. Clique em baixar para gerar um PNG perfeito para WhatsApp/Instagram.</small>
    </div>

    <!-- O Card -->
    <div class="card-wrapper">
        <div class="card" id="capture-card">
            <div class="header">
                <div class="meta-master">META<br>MASTER</div>
                <div class="batida">BATIDA!</div>
            </div>

            <div class="photo-container">
                <!-- Usando uma imagem de exemplo (Pikachu). Basta o usuário trocar a URL! -->
                <img id="cardPhoto" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/25.png" alt="Consultor" class="photo-img">
            </div>

            <div class="black-bg"></div>

            <div class="name-banner">
                <h1 class="name-text" id="cardName">DANIEL MOURA</h1>
            </div>

            <div class="logos-footer">
                <!-- FEBRACIS -->
                <div class="logo-febracis">
                    <div class="febracis-icon">
                        <!-- Ícone de águia abstrato via SVG -->
                        <svg viewBox="0 0 100 100">
                            <path d="M10,80 L35,25 L50,45 L70,15 L90,65 L65,90 Z" />
                        </svg>
                    </div>
                    <div class="febracis-text">
                        <div class="f-title">FEBRACIS</div>
                        <div class="f-sub">ESCOLA DE NEGÓCIOS</div>
                    </div>
                </div>

                <!-- FRZ GRUPO -->
                <div class="logo-frz">
                    <div class="frz-title">FRZ</div>
                    <div class="frz-sub"><span class="line"></span>GRUPO<span class="line"></span></div>
                </div>

                <!-- LEADFIT -->
                <div class="logo-leadfit">
                    <div class="l7-icon">L7</div>
                    <div class="leadfit-title">LEADFIT</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function updateName() {
            const input = document.getElementById('nameInput').value;
            document.getElementById('cardName').textContent = input || 'NOME DO CONSULTOR';
        }

        function updatePhoto() {
            const input = document.getElementById('photoInput').value;
            if (input) {
                document.getElementById('cardPhoto').src = input;
            }
        }

        function downloadCard() {
            const card = document.getElementById('capture-card');
            
            // Usamos html2canvas para tirar um "print" do HTML e salvar como PNG
            html2canvas(card, {
                scale: 2, // Dobra a resolução para não ficar embaçado no celular
                useCORS: true, // Permite carregar imagens de outros sites
                backgroundColor: null
            }).then(canvas => {
                let link = document.createElement('a');
                link.download = `Meta_Master_${document.getElementById('nameInput').value}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }
    </script>
</body>
</html>
