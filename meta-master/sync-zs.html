<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Sincronizar ZS</title>
<!--
  Janelinha do botão "⟳ Sincronizar ZS" da Pipeline Comercial.

  Existe por causa do Chrome 154: uma página da internet (o dashboard no GitHub
  Pages) NÃO pode chamar http://localhost por fetch ("Permission was denied for
  this request to access the `loopback` address space"), nem com a permissão
  concedida. Abrir uma JANELA no localhost é navegação, não chamada — passa.
  Aqui a chamada à /api/sync-zs é do próprio servidor (mesma origem), então não
  há CORS nem rede local no caminho. Ao terminar, avisa a Pipeline por
  postMessage e se fecha.
-->
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #0f141b; color: #e6edf3; font: 14px/1.5 "Segoe UI", system-ui, sans-serif; }
  .box { width: 100%; max-width: 380px; padding: 22px 24px; text-align: center; }
  h1 { margin: 0 0 6px; font-size: 16px; color: #e3c46a; }
  p { margin: 6px 0 0; color: #9aa5b1; }
  .giro { width: 30px; height: 30px; margin: 14px auto; border: 3px solid rgba(227,196,106,.25);
          border-top-color: #e3c46a; border-radius: 50%; animation: g 0.9s linear infinite; }
  @keyframes g { to { transform: rotate(360deg); } }
  .ok { color: #7fe0a4; } .erro { color: #ff8b8b; }
</style>
</head>
<body>
<div class="box">
  <h1>⟳ Sincronizar ZS</h1>
  <div class="giro" id="giro"></div>
  <p id="msg">Lendo as vendas no ZS… (20 a 40 s)</p>
</div>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var periodo = /^\d{4}-\d{2}$/.test(q.get('periodo') || '') ? q.get('periodo') : '';
  var msg = document.getElementById('msg'), giro = document.getElementById('giro');

  function avisar(dados) {
    /* "*": a origem da Pipeline varia (Pages, :5500, arquivo). Só vai o placar
       do sync — as vendas em si a Pipeline relê do Firebase. */
    try { if (window.opener) window.opener.postMessage({ tipo: 'sync-zs', resultado: dados }, '*'); } catch (e) {}
  }
  function fim(texto, cls, fechar) {
    giro.style.display = 'none';
    msg.className = cls; msg.textContent = texto;
    if (fechar && window.opener) setTimeout(function () { window.close(); }, 1500);
  }

  fetch('/api/sync-zs' + (periodo ? '?periodo=' + periodo : ''), { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (j) {
      avisar(j);
      if (j && j.ok) fim('✅ Pronto: ' + j.vendas + ' venda(s) no ZS. Pode fechar.', 'ok', true);
      else fim('❌ ' + ((j && j.erro) || 'falha na sincronização'), 'erro', false);
    })
    .catch(function (e) {
      var j = { ok: false, erro: 'o servidor do Meta Master não respondeu (' + (e && e.message || 'erro') + ')' };
      avisar(j);
      fim('❌ ' + j.erro, 'erro', false);
    });
})();
</script>
</body>
</html>
