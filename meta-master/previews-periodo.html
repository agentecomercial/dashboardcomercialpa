<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seletor de Período (meses) — 10 opções</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800;900&display=swap');
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#141414;color:#eee;font-family:'Archivo',system-ui,Segoe UI,Arial,sans-serif;padding:26px;line-height:1.4;}
  h1{font-size:22px;font-weight:900;letter-spacing:.5px;}
  .lead{color:#9a9a9a;font-size:13px;margin:6px 0 22px;max-width:820px;}
  .lead b{color:#F0C84A;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:18px;}
  .demo{background:#1f1f1f;border:1px solid #3a3a3a;border-radius:14px;padding:16px;}
  .demo h3{font-size:13px;font-weight:900;color:#F0C84A;letter-spacing:.4px;margin-bottom:3px;}
  .demo .sub{font-size:11px;color:#888;margin-bottom:14px;}
  .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:#9a9a9a;font-weight:800;margin-bottom:7px;display:block;}
  .out{margin-top:13px;font-size:12px;color:#7fd98a;background:#151715;border:1px solid #2c3a2c;border-radius:7px;padding:7px 10px;}
  .out b{color:#bff0c4;}
  input,select,button{font-family:inherit;}
  input[type=month],input[type=text],select{background:#161616;border:1px solid #3a3a3a;color:#eee;border-radius:8px;padding:9px 11px;font-size:13px;}
  input:focus,select:focus{outline:none;border-color:#F0C84A;}
  .row{display:flex;align-items:center;gap:9px;flex-wrap:wrap;}
  .sep{color:#888;font-size:12px;}

  /* grade de meses (range) */
  .mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
  .mhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;}
  .mhead b{font-size:13px;color:#eee;font-weight:800;}
  .navb{background:#262626;border:1px solid #3a3a3a;color:#ddd;width:30px;height:28px;border-radius:7px;cursor:pointer;font-weight:900;}
  .navb:hover{background:#2f2f2f;color:#fff;}
  .mcell{background:#1c1c1c;border:1px solid #333;color:#cfcfcf;font-weight:700;font-size:12.5px;padding:9px 0;border-radius:8px;cursor:pointer;text-align:center;transition:.1s;}
  .mcell:hover{background:#262626;color:#fff;}
  .mcell.rng{background:#2a2410;border-color:#4a3f1f;color:#e2c878;}
  .mcell.end{background:#F0C84A;border-color:#F0C84A;color:#111;}

  /* chips / pills */
  .chips{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{background:#262626;border:1px solid #3a3a3a;color:#cfcfcf;font-weight:700;font-size:12px;padding:7px 12px;border-radius:18px;cursor:pointer;}
  .chip:hover{background:#2f2f2f;color:#fff;}
  .chip.on{background:#F0C84A;border-color:#F0C84A;color:#111;}

  /* dropdown */
  .dd{position:relative;}
  .ddbtn{width:100%;display:flex;align-items:center;gap:8px;background:#161616;border:1px solid #3a3a3a;color:#eee;border-radius:9px;padding:10px 13px;font-size:13px;font-weight:700;cursor:pointer;text-align:left;}
  .ddbtn .car{margin-left:auto;color:#F0C84A;font-size:10px;}
  .ddpan{position:absolute;z-index:30;top:calc(100% + 6px);left:0;right:0;background:#1c1c1c;border:1px solid #444;border-radius:11px;padding:10px;box-shadow:0 14px 34px rgba(0,0,0,.55);display:none;}
  .dd.open .ddpan{display:block;}
  .ddgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;}
  .ddopt{display:flex;align-items:center;gap:6px;font-size:12px;color:#ccc;padding:5px 6px;border-radius:6px;cursor:pointer;}
  .ddopt:hover{background:#262626;}

  /* presets */
  .presets{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
  .preset{background:#1c1c1c;border:1px solid #3a3a3a;color:#cfcfcf;font-weight:700;font-size:12px;padding:7px 12px;border-radius:8px;cursor:pointer;}
  .preset:hover{background:#262626;color:#fff;}
  .preset.on{background:#241f11;border-color:#4a3f1f;color:#F0C84A;}

  /* slider */
  .slid{padding:6px 4px 2px;}
  .slid .track{position:relative;height:30px;}
  .slid input[type=range]{position:absolute;left:0;right:0;width:100%;-webkit-appearance:none;background:transparent;pointer-events:none;margin:0;top:8px;}
  .slid input[type=range]::-webkit-slider-runnable-track{height:5px;background:#333;border-radius:3px;}
  .slid input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:auto;width:18px;height:18px;border-radius:50%;background:#F0C84A;border:2px solid #111;cursor:pointer;margin-top:-7px;}
  .slid .scale{display:flex;justify-content:space-between;font-size:9px;color:#777;margin-top:4px;}

  /* popover */
  .pop{position:relative;}
  .popbtn{background:#161616;border:1px solid #3a3a3a;color:#F0C84A;border-radius:9px;padding:10px 14px;font-size:13px;font-weight:800;cursor:pointer;}
  .poppan{position:absolute;z-index:30;top:calc(100% + 6px);left:0;background:#1c1c1c;border:1px solid #444;border-radius:11px;padding:12px;box-shadow:0 14px 34px rgba(0,0,0,.55);display:none;width:300px;}
  .pop.open .poppan{display:block;}

  /* extras (11-30) */
  .tline{display:flex;gap:5px;overflow-x:auto;padding:6px 2px;}
  .tline::-webkit-scrollbar{height:6px;} .tline::-webkit-scrollbar-thumb{background:#444;border-radius:3px;}
  .tcell{flex:0 0 auto;min-width:50px;text-align:center;background:#1c1c1c;border:1px solid #333;color:#cfcfcf;font-weight:700;font-size:11px;padding:8px 6px;border-radius:8px;cursor:pointer;}
  .tcell .yr{display:block;font-size:9px;color:#888;}
  .tcell:hover{background:#262626;color:#fff;}
  .tcell.rng{background:#2a2410;border-color:#4a3f1f;color:#e2c878;}
  .tcell.end{background:#F0C84A;border-color:#F0C84A;color:#111;}
  .tcell.end .yr,.tcell.rng .yr{color:inherit;opacity:.7;}
  .step{display:flex;align-items:center;gap:8px;}
  .step .disp{min-width:92px;text-align:center;background:#161616;border:1px solid #3a3a3a;border-radius:8px;padding:9px 6px;font-weight:800;color:#F0C84A;font-size:13px;}
  .row2{display:flex;gap:16px;flex-wrap:wrap;}
  .qline{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;}
  .qcell{background:#1c1c1c;border:1px solid #333;color:#cfcfcf;font-weight:700;font-size:11px;padding:8px 0;border-radius:7px;cursor:pointer;text-align:center;}
  .qcell:hover{background:#262626;color:#fff;}
  .qcell.rng{background:#2a2410;border-color:#4a3f1f;color:#e2c878;}
  .qcell.end{background:#F0C84A;border-color:#F0C84A;color:#111;}
  .vlist{max-height:170px;overflow:auto;border:1px solid #333;border-radius:8px;}
  .vrow{padding:7px 11px;font-size:12.5px;color:#cfcfcf;cursor:pointer;border-bottom:1px solid #242424;}
  .vrow:hover{background:#262626;color:#fff;} .vrow.rng{background:#2a2410;color:#e2c878;} .vrow.end{background:#F0C84A;color:#111;font-weight:800;}
  .tags2{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
  .tag2{background:#241f11;border:1px solid #4a3f1f;color:#F0C84A;font-size:12px;font-weight:700;padding:5px 9px;border-radius:7px;display:flex;align-items:center;gap:6px;}
  .tag2 b{cursor:pointer;}
  .heat{display:flex;flex-direction:column;gap:4px;}
  .heatrow{display:grid;grid-template-columns:44px repeat(12,1fr);gap:3px;align-items:center;}
  .heatrow .yl{font-size:10px;color:#888;font-weight:800;}
  .hcell{height:24px;border-radius:5px;background:#1c1c1c;border:1px solid #2c2c2c;cursor:pointer;}
  .hcell:hover{background:#2a2a2a;} .hcell.rng{background:#2a2410;border-color:#4a3f1f;} .hcell.end{background:#F0C84A;border-color:#F0C84A;}
  .acc .accyr{background:#1c1c1c;border:1px solid #333;border-radius:8px;margin-bottom:6px;overflow:hidden;}
  .acc .acch{padding:9px 12px;font-weight:800;cursor:pointer;display:flex;justify-content:space-between;color:#ddd;}
  .acc .accb{display:none;padding:8px;} .acc .accyr.open .accb{display:block;}
  .carou{display:flex;align-items:center;gap:8px;}
  .carwin{display:flex;gap:5px;overflow:hidden;flex:1;justify-content:center;}
</style>
</head>
<body>
  <h1>📅 Seletor de Período (intervalo de meses) — 30 opções</h1>
  <p class="lead">Cada opção é <b>funcional</b>: selecione e veja embaixo o que seria enviado aos scripts (<b>mês inicial → mês final</b>, formato <b>AAAA-MM</b>). Me diga o <b>número</b> que prefere e eu aplico no filtro + adapto os scripts pra aceitar o intervalo.</p>
  <div class="grid" id="grid"></div>

<script>
  const MN=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  const HOJE=new Date(), ANO=HOJE.getFullYear(), MES=HOJE.getMonth();      // mês 0-11
  const ym=(a,m)=> a+'-'+String(m+1).padStart(2,'0');
  const HOJEYM=ym(ANO,MES);
  function addMes(yms,delta){ let [a,m]=yms.split('-').map(Number); m=m-1+delta; a+=Math.floor(m/12); m=((m%12)+12)%12; return ym(a,m); }
  function nMeses(ini,fim){ const [a1,m1]=ini.split('-').map(Number), [a2,m2]=fim.split('-').map(Number); return (a2-a1)*12+(m2-m1)+1; }
  function fmt(yms){ const [a,m]=yms.split('-').map(Number); return MN[m-1]+'/'+a; }
  function setRange(host,ini,fim){ if(!ini){ host.querySelector('.out').innerHTML='envia: <b>(nenhum)</b>'; return; }
    if(!fim||fim===ini){ host.querySelector('.out').innerHTML='envia: <b>'+ini+'</b> ('+fmt(ini)+')'; return; }
    host.querySelector('.out').innerHTML='envia: <b>'+ini+'</b> → <b>'+fim+'</b> ('+fmt(ini)+' a '+fmt(fim)+' · '+nMeses(ini,fim)+' meses)'; }
  function setLista(host,arr){ if(!arr.length){ host.querySelector('.out').innerHTML='envia: <b>(nenhum)</b>'; return; }
    host.querySelector('.out').innerHTML='envia: <b>'+arr.join(', ')+'</b> ('+arr.length+' '+(arr.length>1?'meses':'mês')+')'; }

  const DEMOS=[
    {t:'1. Dois campos "mês" (De / Até)', s:'Dois seletores nativos de mês. Simples e direto.', build:b1},
    {t:'2. Selects de mês + ano', s:'Quatro listas: mês e ano do início, mês e ano do fim.', build:b2},
    {t:'3. Grade de meses (clica início → fim)', s:'Calendário de meses com navegação de ano; clica o início e o fim, o intervalo fica destacado.', build:b3},
    {t:'4. Chips (marca vários meses)', s:'Etiquetas de mês; marque quantos quiser (não precisa ser sequência).', build:b4},
    {t:'5. Dropdown com checkboxes', s:'Botão abre um painel com os 12 meses para marcar.', build:b5},
    {t:'6. Range slider (dois controles)', s:'Linha do ano com dois cursores: arraste o início e o fim.', build:b6},
    {t:'7. Atalhos rápidos (presets)', s:'Este mês, mês passado, últimos 3/6, trimestre, ano…', build:b7},
    {t:'8. Atalhos + dois campos mês', s:'Atalhos no topo que preenchem os dois campos, ainda editáveis.', build:b8},
    {t:'9. Popover "Jan/26 – Mar/26"', s:'Botão compacto que abre uma grade de meses para escolher o intervalo.', build:b9},
    {t:'10. Texto livre (AAAA-MM a AAAA-MM)', s:'Digite o intervalo; valida e mostra o resultado.', build:b10},
    {t:'11. Timeline horizontal (role)', s:'Faixa rolável de meses; clica início e fim.', build:b11},
    {t:'12. Steppers De / Até', s:'Cada campo com ◀ ▶ para avançar/voltar mês.', build:b12},
    {t:'13. Linha única de 12 meses', s:'Os 12 meses do ano numa linha só; nav de ano.', build:b13},
    {t:'14. Por trimestre', s:'T1/T2/T3/T4 + navegação de ano.', build:b14},
    {t:'15. Dois popovers (Início / Fim)', s:'Cada botão abre uma grade de meses.', build:b15},
    {t:'16. Atalhos + grade', s:'Presets numa coluna ao lado da grade de meses.', build:b16},
    {t:'17. Dropdown com De/Até dentro', s:'Botão abre painel com os dois campos de mês.', build:b17},
    {t:'18. Por semestre', s:'1º / 2º semestre ou ano inteiro + nav de ano.', build:b18},
    {t:'19. Períodos relativos', s:'MTD, YTD, últimos 3/6/12 meses.', build:b19},
    {t:'20. Duas grades (Início | Fim)', s:'Uma grade para o início, outra para o fim.', build:b20},
    {t:'21. Lista vertical (clica início→fim)', s:'Coluna rolável de meses, recente no topo.', build:b21},
    {t:'22. Tags removíveis', s:'Adiciona meses; cada um vira uma tag com ✕.', build:b22},
    {t:'23. Slider de 24 meses', s:'Dois cursores sobre os últimos 24 meses.', build:b23},
    {t:'24. Ano + chips dos meses', s:'Escolhe o ano e marca os meses dele.', build:b24},
    {t:'25. Carrossel de meses', s:'Janela de 6 meses; setas deslizam no tempo.', build:b25},
    {t:'26. Popover com 2 calendários', s:'Início e fim lado a lado num popover (estilo GA).', build:b26},
    {t:'27. Acordeão por ano', s:'Expande o ano e marca os meses (multi).', build:b27},
    {t:'28. Selects de/até inline', s:'mês+ano de início e fim, tudo numa linha.', build:b28},
    {t:'29. Heatmap (anos × meses)', s:'Matriz de 3 anos × 12 meses; clica início→fim.', build:b29},
    {t:'30. Texto com sugestões (datalist)', s:'Digita com autocompletar dos meses.', build:b30},
  ];

  // 1 — dois month
  function b1(host){
    const box=el('<div><span class="lbl">Período</span><div class="row"><input type="month" class="i1"><span class="sep">até</span><input type="month" class="i2"></div></div>');
    const i1=box.querySelector('.i1'), i2=box.querySelector('.i2'); i1.value=HOJEYM; i2.value=HOJEYM;
    const upd=()=>{ let a=i1.value,b=i2.value; if(a&&b&&b<a){[a,b]=[b,a];} setRange(host,a,b); };
    i1.onchange=upd; i2.onchange=upd; mount(host,box); upd();
  }
  // 2 — selects mês+ano
  function b2(host){
    const anos=[]; for(let a=ANO-3;a<=ANO+1;a++) anos.push(a);
    const selMes=v=>'<select class="'+v+'">'+MN.map((n,i)=>'<option value="'+i+'">'+n+'</option>').join('')+'</select>';
    const selAno=v=>'<select class="'+v+'">'+anos.map(a=>'<option value="'+a+'">'+a+'</option>').join('')+'</select>';
    const box=el('<div><span class="lbl">Início</span><div class="row">'+selMes('m1')+selAno('a1')+'</div><span class="lbl" style="margin-top:10px">Fim</span><div class="row">'+selMes('m2')+selAno('a2')+'</div></div>');
    const g=c=>box.querySelector(c);
    g('.m1').value=MES; g('.a1').value=ANO; g('.m2').value=MES; g('.a2').value=ANO;
    const upd=()=>{ let a=ym(+g('.a1').value,+g('.m1').value), b=ym(+g('.a2').value,+g('.m2').value); if(b<a)[a,b]=[b,a]; setRange(host,a,b); };
    box.querySelectorAll('select').forEach(s=>s.onchange=upd); mount(host,box); upd();
  }
  // grade reutilizável (range)
  function gradeMeses(anoIni, onPick){
    let ano=anoIni, ini=null, fim=null;
    const wrap=el('<div><div class="mhead"><button class="navb p">◀</button><b></b><button class="navb n">▶</button></div><div class="mgrid"></div></div>');
    const lbl=wrap.querySelector('b'), grid=wrap.querySelector('.mgrid');
    function render(){ lbl.textContent=ano; grid.innerHTML='';
      for(let i=0;i<12;i++){ const v=ym(ano,i); const c=el('<div class="mcell">'+MN[i]+'</div>');
        if(ini&&fim){ if(v===ini||v===fim) c.classList.add('end'); else if(v>ini&&v<fim) c.classList.add('rng'); }
        else if(v===ini) c.classList.add('end');
        c.onclick=()=>{ if(!ini||(ini&&fim)){ ini=v; fim=null; } else { if(v<ini){ fim=ini; ini=v; } else fim=v; } render(); onPick(ini,fim); };
        grid.appendChild(c);
      }
    }
    wrap.querySelector('.p').onclick=()=>{ano--;render();};
    wrap.querySelector('.n').onclick=()=>{ano++;render();};
    render(); return wrap;
  }
  // 3 — grade inline
  function b3(host){ const box=el('<div><span class="lbl">Período (clique início e fim)</span></div>');
    box.appendChild(gradeMeses(ANO,(i,f)=>setRange(host,i,f))); mount(host,box); }
  // 4 — chips multi
  function b4(host){
    const box=el('<div><span class="lbl">Meses ('+ANO+')</span><div class="chips"></div></div>');
    const wrap=box.querySelector('.chips'); const sel=new Set();
    MN.forEach((n,i)=>{ const c=el('<button class="chip">'+n+'</button>'); c.onclick=()=>{ const v=ym(ANO,i); if(sel.has(v)){sel.delete(v);c.classList.remove('on');}else{sel.add(v);c.classList.add('on');} setLista(host,[...sel].sort()); }; wrap.appendChild(c); });
    mount(host,box);
  }
  // 5 — dropdown checkboxes
  function b5(host){
    const box=el('<div><span class="lbl">Meses</span><div class="dd"><button class="ddbtn"><span class="txt">Selecionar meses…</span><span class="car">▼</span></button><div class="ddpan"><div class="ddgrid"></div></div></div></div>');
    const dd=box.querySelector('.dd'), btn=box.querySelector('.ddbtn'), grid=box.querySelector('.ddgrid'), txt=box.querySelector('.txt'); const sel=new Set();
    MN.forEach((n,i)=>{ const o=el('<label class="ddopt"><input type="checkbox"> '+n+'</label>'); o.querySelector('input').onchange=e=>{ const v=ym(ANO,i); if(e.target.checked)sel.add(v); else sel.delete(v); const a=[...sel].sort(); txt.textContent=a.length?a.length+' mês(es)':'Selecionar meses…'; setLista(host,a); }; grid.appendChild(o); });
    btn.onclick=e=>{e.stopPropagation();dd.classList.toggle('open');}; box.querySelector('.ddpan').onclick=e=>e.stopPropagation();
    mount(host,box);
  }
  // 6 — range slider
  function b6(host){
    const box=el('<div><span class="lbl">Período ('+ANO+')</span><div class="slid"><div class="track"><input type="range" class="r1" min="0" max="11" value="0"><input type="range" class="r2" min="0" max="11" value="'+MES+'"></div><div class="scale">'+MN.map(m=>'<span>'+m[0]+'</span>').join('')+'</div></div></div>');
    const r1=box.querySelector('.r1'), r2=box.querySelector('.r2');
    const upd=()=>{ let a=+r1.value,b=+r2.value; if(a>b)[a,b]=[b,a]; setRange(host,ym(ANO,a),ym(ANO,b)); };
    r1.oninput=upd; r2.oninput=upd; mount(host,box); upd();
  }
  // 7 — presets
  function presetRanges(){ return [
    ['Este mês', HOJEYM, HOJEYM],
    ['Mês passado', addMes(HOJEYM,-1), addMes(HOJEYM,-1)],
    ['Últimos 3 meses', addMes(HOJEYM,-2), HOJEYM],
    ['Últimos 6 meses', addMes(HOJEYM,-5), HOJEYM],
    ['Trimestre atual', ym(ANO, Math.floor(MES/3)*3), ym(ANO, Math.floor(MES/3)*3+2)],
    ['Ano '+ANO, ym(ANO,0), ym(ANO,11)],
  ]; }
  function b7(host){
    const box=el('<div><span class="lbl">Atalhos</span><div class="presets"></div></div>');
    const wrap=box.querySelector('.presets');
    presetRanges().forEach(([nm,a,b])=>{ const p=el('<button class="preset">'+nm+'</button>'); p.onclick=()=>{ wrap.querySelectorAll('.preset').forEach(x=>x.classList.remove('on')); p.classList.add('on'); setRange(host,a,b); }; wrap.appendChild(p); });
    mount(host,box);
  }
  // 8 — presets + dois month
  function b8(host){
    const box=el('<div><span class="lbl">Atalhos</span><div class="presets"></div><span class="lbl" style="margin-top:6px">Personalizado</span><div class="row"><input type="month" class="i1"><span class="sep">até</span><input type="month" class="i2"></div></div>');
    const i1=box.querySelector('.i1'), i2=box.querySelector('.i2'); i1.value=addMes(HOJEYM,-2); i2.value=HOJEYM;
    const wrap=box.querySelector('.presets');
    const upd=()=>{ let a=i1.value,b=i2.value; if(a&&b&&b<a)[a,b]=[b,a]; setRange(host,a,b); };
    presetRanges().forEach(([nm,a,b])=>{ const p=el('<button class="preset">'+nm+'</button>'); p.onclick=()=>{ wrap.querySelectorAll('.preset').forEach(x=>x.classList.remove('on')); p.classList.add('on'); i1.value=a; i2.value=b; upd(); }; wrap.appendChild(p); });
    i1.onchange=()=>{wrap.querySelectorAll('.preset').forEach(x=>x.classList.remove('on'));upd();};
    i2.onchange=()=>{wrap.querySelectorAll('.preset').forEach(x=>x.classList.remove('on'));upd();};
    mount(host,box); upd();
  }
  // 9 — popover com grade
  function b9(host){
    const box=el('<div><span class="lbl">Período</span><div class="pop"><button class="popbtn">📅 Escolher meses ▾</button><div class="poppan"></div></div></div>');
    const pop=box.querySelector('.pop'), btn=box.querySelector('.popbtn'), pan=box.querySelector('.poppan');
    pan.appendChild(gradeMeses(ANO,(i,f)=>{ setRange(host,i,f); btn.textContent='📅 '+ (f&&f!==i ? (fmt(i)+' – '+fmt(f)) : (i?fmt(i):'Escolher meses')) +' ▾'; }));
    btn.onclick=e=>{e.stopPropagation();pop.classList.toggle('open');}; pan.onclick=e=>e.stopPropagation();
    mount(host,box);
  }
  // 10 — texto livre
  function b10(host){
    const box=el('<div><span class="lbl">Período (AAAA-MM a AAAA-MM)</span><input type="text" class="it" style="width:100%" placeholder="'+addMes(HOJEYM,-2)+' a '+HOJEYM+'"></div>');
    const it=box.querySelector('.it'); it.value=addMes(HOJEYM,-2)+' a '+HOJEYM;
    const upd=()=>{ const m=it.value.match(/(\d{4}-\d{2})\s*(?:a|–|-|até)\s*(\d{4}-\d{2})/i); if(m){ let a=m[1],b=m[2]; if(b<a)[a,b]=[b,a]; setRange(host,a,b); } else { const s=it.value.match(/(\d{4}-\d{2})/); if(s) setRange(host,s[1],s[1]); else host.querySelector('.out').innerHTML='envia: <b style="color:#e79">formato inválido</b>'; } };
    it.oninput=upd; mount(host,box); upd();
  }

  // ===== helpers extras (11-30) =====
  let _uid=0;
  function gerar(iniYM,count){ const a=[]; for(let i=0;i<count;i++) a.push(addMes(iniYM,i)); return a; }
  function rangePicker(cells,onChange){ let ini=null,fim=null;
    function paint(){ cells.forEach(c=>{ c.node.classList.remove('rng','end'); if(ini&&fim){ if(c.ym===ini||c.ym===fim)c.node.classList.add('end'); else if(c.ym>ini&&c.ym<fim)c.node.classList.add('rng'); } else if(c.ym===ini)c.node.classList.add('end'); }); }
    cells.forEach(c=>c.node.onclick=()=>{ if(!ini||(ini&&fim)){ini=c.ym;fim=null;}else{ if(c.ym<ini){fim=ini;ini=c.ym;}else fim=c.ym; } paint(); onChange(ini,fim); });
    return {paint}; }
  function gradeUnica(anoIni,onPick){ let ano=anoIni,sel=null;
    const wrap=el('<div><div class="mhead"><button class="navb p">◀</button><b></b><button class="navb n">▶</button></div><div class="mgrid"></div></div>');
    const lbl=wrap.querySelector('b'),grid=wrap.querySelector('.mgrid');
    function render(){ lbl.textContent=ano; grid.innerHTML=''; for(let i=0;i<12;i++){ const v=ym(ano,i); const c=el('<div class="mcell">'+MN[i]+'</div>'); if(v===sel)c.classList.add('end'); c.onclick=()=>{sel=v;render();onPick(sel);}; grid.appendChild(c);} }
    wrap.querySelector('.p').onclick=()=>{ano--;render();}; wrap.querySelector('.n').onclick=()=>{ano++;render();};
    render(); return {wrap}; }

  function b11(host){ const meses=gerar(addMes(HOJEYM,-17),18); const box=el('<div><span class="lbl">Período (role e clique início→fim)</span><div class="tline"></div></div>'); const t=box.querySelector('.tline'); const cells=meses.map(v=>{ const p=v.split('-'); const n=el('<div class="tcell">'+MN[+p[1]-1]+'<span class="yr">'+p[0]+'</span></div>'); t.appendChild(n); return {ym:v,node:n}; }); rangePicker(cells,(i,f)=>setRange(host,i,f)); mount(host,box); setTimeout(()=>{t.scrollLeft=t.scrollWidth;},0); }
  function b12(host){ let ini=addMes(HOJEYM,-2),fim=HOJEYM;
    const box=el('<div><div class="row2"><div><span class="lbl">Início</span><div class="step"><button class="navb pi">◀</button><span class="disp di"></span><button class="navb ni">▶</button></div></div><div><span class="lbl">Fim</span><div class="step"><button class="navb pf">◀</button><span class="disp df"></span><button class="navb nf">▶</button></div></div></div></div>');
    const di=box.querySelector('.di'),df=box.querySelector('.df');
    function upd(){ if(fim<ini)fim=ini; di.textContent=fmt(ini); df.textContent=fmt(fim); setRange(host,ini,fim); }
    box.querySelector('.pi').onclick=()=>{ini=addMes(ini,-1);upd();}; box.querySelector('.ni').onclick=()=>{ini=addMes(ini,1);upd();};
    box.querySelector('.pf').onclick=()=>{fim=addMes(fim,-1);upd();}; box.querySelector('.nf').onclick=()=>{fim=addMes(fim,1);upd();};
    mount(host,box); upd(); }
  function b13(host){ let ano=ANO; const box=el('<div><div class="mhead"><button class="navb p">◀</button><b></b><button class="navb n">▶</button></div><div class="qline"></div></div>');
    const lbl=box.querySelector('b'),q=box.querySelector('.qline');
    function render(){ lbl.textContent=ano; q.innerHTML=''; const cells=[]; for(let i=0;i<12;i++){ const v=ym(ano,i); const n=el('<div class="qcell">'+MN[i]+'</div>'); q.appendChild(n); cells.push({ym:v,node:n}); } rangePicker(cells,(i,f)=>setRange(host,i,f)); }
    box.querySelector('.p').onclick=()=>{ano--;render();}; box.querySelector('.n').onclick=()=>{ano++;render();}; render(); mount(host,box); }
  function b14(host){ let ano=ANO; const box=el('<div><div class="mhead"><button class="navb p">◀</button><b></b><button class="navb n">▶</button></div><div class="presets tq"></div></div>');
    const lbl=box.querySelector('b'),wrap=box.querySelector('.tq');
    function render(){ lbl.textContent=ano; wrap.innerHTML=''; [['1º Tri',0],['2º Tri',3],['3º Tri',6],['4º Tri',9]].forEach(p=>{ const b=el('<button class="preset">'+p[0]+'</button>'); b.onclick=()=>{ wrap.querySelectorAll('.preset').forEach(x=>x.classList.remove('on')); b.classList.add('on'); setRange(host,ym(ano,p[1]),ym(ano,p[1]+2)); }; wrap.appendChild(b); }); }
    box.querySelector('.p').onclick=()=>{ano--;render();}; box.querySelector('.n').onclick=()=>{ano++;render();}; render(); mount(host,box); }
  function b15(host){ let ini=null,fim=null;
    const box=el('<div><span class="lbl">Período</span><div class="row"><div class="pop pi"><button class="popbtn bi">Início ▾</button><div class="poppan"></div></div><span class="sep">até</span><div class="pop pf"><button class="popbtn bf">Fim ▾</button><div class="poppan"></div></div></div></div>');
    const upd=()=>{ let a=ini,b=fim; if(a&&b&&b<a){const t=a;a=b;b=t;} setRange(host,a,b); };
    box.querySelector('.pi .poppan').appendChild(gradeUnica(ANO,v=>{ini=v;box.querySelector('.bi').textContent=fmt(v)+' ▾';upd();}).wrap);
    box.querySelector('.pf .poppan').appendChild(gradeUnica(ANO,v=>{fim=v;box.querySelector('.bf').textContent=fmt(v)+' ▾';upd();}).wrap);
    box.querySelector('.bi').onclick=e=>{e.stopPropagation();box.querySelector('.pi').classList.toggle('open');};
    box.querySelector('.bf').onclick=e=>{e.stopPropagation();box.querySelector('.pf').classList.toggle('open');};
    box.querySelectorAll('.poppan').forEach(p=>p.onclick=e=>e.stopPropagation()); mount(host,box); }
  function b16(host){ const box=el('<div><span class="lbl">Período</span><div class="row2"><div class="presets pc" style="flex-direction:column;min-width:120px"></div><div class="gc" style="flex:1;min-width:230px"></div></div></div>');
    const wrap=box.querySelector('.pc'); box.querySelector('.gc').appendChild(gradeMeses(ANO,(i,f)=>setRange(host,i,f)));
    presetRanges().forEach(p=>{ const b=el('<button class="preset">'+p[0]+'</button>'); b.onclick=()=>{ wrap.querySelectorAll('.preset').forEach(x=>x.classList.remove('on')); b.classList.add('on'); setRange(host,p[1],p[2]); }; wrap.appendChild(b); }); mount(host,box); }
  function b17(host){ const box=el('<div><span class="lbl">Período</span><div class="dd"><button class="ddbtn"><span class="txt">Definir período…</span><span class="car">▼</span></button><div class="ddpan"><div class="row"><input type="month" class="i1"><span class="sep">até</span><input type="month" class="i2"></div></div></div></div>');
    const dd=box.querySelector('.dd'),btn=box.querySelector('.ddbtn'),i1=box.querySelector('.i1'),i2=box.querySelector('.i2'),txt=box.querySelector('.txt'); i1.value=addMes(HOJEYM,-2); i2.value=HOJEYM;
    const upd=()=>{ let a=i1.value,b=i2.value; if(a&&b&&b<a){const t=a;a=b;b=t;} txt.textContent=fmt(a)+' – '+fmt(b); setRange(host,a,b); };
    btn.onclick=e=>{e.stopPropagation();dd.classList.toggle('open');}; box.querySelector('.ddpan').onclick=e=>e.stopPropagation(); i1.onchange=upd;i2.onchange=upd; mount(host,box); upd(); }
  function b18(host){ let ano=ANO; const box=el('<div><div class="mhead"><button class="navb p">◀</button><b></b><button class="navb n">▶</button></div><div class="presets ts"></div></div>');
    const lbl=box.querySelector('b'),wrap=box.querySelector('.ts');
    function render(){ lbl.textContent=ano; wrap.innerHTML=''; [['1º Semestre',0,5],['2º Semestre',6,11],['Ano inteiro',0,11]].forEach(p=>{ const b=el('<button class="preset">'+p[0]+'</button>'); b.onclick=()=>{ wrap.querySelectorAll('.preset').forEach(x=>x.classList.remove('on')); b.classList.add('on'); setRange(host,ym(ano,p[1]),ym(ano,p[2])); }; wrap.appendChild(b); }); }
    box.querySelector('.p').onclick=()=>{ano--;render();}; box.querySelector('.n').onclick=()=>{ano++;render();}; render(); mount(host,box); }
  function b19(host){ const box=el('<div><span class="lbl">Períodos relativos</span><div class="presets"></div></div>'); const wrap=box.querySelector('.presets');
    [['MTD (este mês)',HOJEYM,HOJEYM],['YTD ('+ANO+')',ym(ANO,0),HOJEYM],['Últimos 3 meses',addMes(HOJEYM,-2),HOJEYM],['Últimos 6 meses',addMes(HOJEYM,-5),HOJEYM],['Últimos 12 meses',addMes(HOJEYM,-11),HOJEYM]].forEach(p=>{ const b=el('<button class="preset">'+p[0]+'</button>'); b.onclick=()=>{ wrap.querySelectorAll('.preset').forEach(x=>x.classList.remove('on')); b.classList.add('on'); setRange(host,p[1],p[2]); }; wrap.appendChild(b); }); mount(host,box); }
  function b20(host){ let ini=null,fim=null; const box=el('<div><div class="row2"><div style="flex:1;min-width:210px"><span class="lbl">Início</span><div class="gi"></div></div><div style="flex:1;min-width:210px"><span class="lbl">Fim</span><div class="gf"></div></div></div></div>');
    const upd=()=>{ let a=ini,b=fim; if(a&&b&&b<a){const t=a;a=b;b=t;} setRange(host,a,b); };
    box.querySelector('.gi').appendChild(gradeUnica(ANO,v=>{ini=v;upd();}).wrap); box.querySelector('.gf').appendChild(gradeUnica(ANO,v=>{fim=v;upd();}).wrap); mount(host,box); }
  function b21(host){ const meses=gerar(addMes(HOJEYM,-17),18).reverse(); const box=el('<div><span class="lbl">Período (clique início→fim)</span><div class="vlist"></div></div>'); const v=box.querySelector('.vlist'); const cells=meses.map(x=>{ const n=el('<div class="vrow">'+fmt(x)+'</div>'); v.appendChild(n); return {ym:x,node:n}; }); rangePicker(cells,(i,f)=>setRange(host,i,f)); mount(host,box); }
  function b22(host){ const box=el('<div><span class="lbl">Adicionar meses</span><div class="row"><input type="month" class="ia"><button class="preset add">+ adicionar</button></div><div class="tags2" style="margin-top:9px"></div></div>');
    const ia=box.querySelector('.ia'),tags=box.querySelector('.tags2'); ia.value=HOJEYM; const sel=new Set();
    function render(){ tags.innerHTML=''; [...sel].sort().forEach(v=>{ const t=el('<span class="tag2">'+fmt(v)+' <b>✕</b></span>'); t.querySelector('b').onclick=()=>{sel.delete(v);render();}; tags.appendChild(t); }); setLista(host,[...sel].sort()); }
    box.querySelector('.add').onclick=()=>{ if(ia.value){sel.add(ia.value);render();} }; mount(host,box); }
  function b23(host){ const base=addMes(HOJEYM,-23); const box=el('<div><span class="lbl">Período (24 meses)</span><div class="slid"><div class="track"><input type="range" class="r1" min="0" max="23" value="21"><input type="range" class="r2" min="0" max="23" value="23"></div><div class="scale"><span>'+fmt(base)+'</span><span>'+fmt(addMes(base,12))+'</span><span>'+fmt(HOJEYM)+'</span></div></div></div>');
    const r1=box.querySelector('.r1'),r2=box.querySelector('.r2'); const upd=()=>{ let a=+r1.value,b=+r2.value; if(a>b){const t=a;a=b;b=t;} setRange(host,addMes(base,a),addMes(base,b)); }; r1.oninput=upd;r2.oninput=upd; mount(host,box); upd(); }
  function b24(host){ const anos=[]; for(let a=ANO-3;a<=ANO+1;a++)anos.push(a); const box=el('<div><span class="lbl">Ano</span><select class="ya">'+anos.map(a=>'<option>'+a+'</option>').join('')+'</select><span class="lbl" style="margin-top:9px">Meses</span><div class="chips"></div></div>');
    const ya=box.querySelector('.ya'),wrap=box.querySelector('.chips'); ya.value=ANO; const sel=new Set();
    function render(){ wrap.innerHTML=''; const ano=+ya.value; MN.forEach((n,i)=>{ const v=ym(ano,i); const c=el('<button class="chip">'+n+'</button>'); if(sel.has(v))c.classList.add('on'); c.onclick=()=>{ if(sel.has(v))sel.delete(v); else sel.add(v); render(); setLista(host,[...sel].sort()); }; wrap.appendChild(c); }); }
    ya.onchange=render; render(); mount(host,box); }
  function b25(host){ let start=addMes(HOJEYM,-11),ini=null,fim=null; const box=el('<div><span class="lbl">Período</span><div class="carou"><button class="navb cp">◀</button><div class="carwin"></div><button class="navb cn">▶</button></div></div>');
    const win=box.querySelector('.carwin');
    function render(){ win.innerHTML=''; gerar(start,6).forEach(v=>{ const p=v.split('-'); const n=el('<div class="tcell">'+MN[+p[1]-1]+'<span class="yr">'+p[0]+'</span></div>'); if(ini&&fim){ if(v===ini||v===fim)n.classList.add('end'); else if(v>ini&&v<fim)n.classList.add('rng'); } else if(v===ini)n.classList.add('end'); n.onclick=()=>{ if(!ini||(ini&&fim)){ini=v;fim=null;}else{ if(v<ini){fim=ini;ini=v;}else fim=v; } render(); setRange(host,ini,fim); }; win.appendChild(n); }); }
    box.querySelector('.cp').onclick=()=>{start=addMes(start,-3);render();}; box.querySelector('.cn').onclick=()=>{start=addMes(start,3);render();}; render(); mount(host,box); }
  function b26(host){ let ini=null,fim=null; const box=el('<div><span class="lbl">Período</span><div class="pop"><button class="popbtn">📅 Selecionar intervalo ▾</button><div class="poppan" style="width:530px"><div class="row2"><div><div class="lbl">Início</div><div class="gi"></div></div><div><div class="lbl">Fim</div><div class="gf"></div></div></div></div></div></div>');
    const pop=box.querySelector('.pop'),btn=box.querySelector('.popbtn'),pan=box.querySelector('.poppan');
    const upd=()=>{ let a=ini,b=fim; if(a&&b&&b<a){const t=a;a=b;b=t;} setRange(host,a,b); btn.textContent='📅 '+((a&&b)?(fmt(a)+' – '+fmt(b)):(a?fmt(a):'Selecionar intervalo'))+' ▾'; };
    box.querySelector('.gi').appendChild(gradeUnica(ANO,v=>{ini=v;upd();}).wrap); box.querySelector('.gf').appendChild(gradeUnica(ANO,v=>{fim=v;upd();}).wrap);
    btn.onclick=e=>{e.stopPropagation();pop.classList.toggle('open');}; pan.onclick=e=>e.stopPropagation(); mount(host,box); }
  function b27(host){ const anos=[ANO-1,ANO,ANO+1]; const box=el('<div><span class="lbl">Meses (por ano)</span><div class="acc"></div></div>'); const acc=box.querySelector('.acc'); const sel=new Set();
    anos.forEach(a=>{ const yr=el('<div class="accyr"><div class="acch">'+a+' <span>▾</span></div><div class="accb"><div class="chips"></div></div></div>'); const chips=yr.querySelector('.chips'); MN.forEach((n,i)=>{ const v=ym(a,i); const c=el('<button class="chip">'+n+'</button>'); c.onclick=()=>{ if(sel.has(v)){sel.delete(v);c.classList.remove('on');}else{sel.add(v);c.classList.add('on');} setLista(host,[...sel].sort()); }; chips.appendChild(c); }); yr.querySelector('.acch').onclick=()=>yr.classList.toggle('open'); acc.appendChild(yr); });
    acc.querySelector('.accyr').classList.add('open'); mount(host,box); }
  function b28(host){ const mk=cls=>'<select class="'+cls+'m">'+MN.map((n,i)=>'<option value="'+i+'">'+n+'</option>').join('')+'</select> <input type="number" class="'+cls+'y" value="'+ANO+'" style="width:74px">';
    const box=el('<div><span class="lbl">Período</span><div class="row"><span class="sep">de</span>'+mk('i')+'<span class="sep">até</span>'+mk('f')+'</div></div>');
    const g=c=>box.querySelector(c); g('.im').value=MES; g('.fm').value=MES;

    box.querySelectorAll('select,input').forEach(s=>{s.onchange=upd;s.oninput=upd;}); mount(host,box); upd(); }
  function b29(host){ const anos=[ANO-2,ANO-1,ANO]; const box=el('<div><span class="lbl">Período (anos × meses)</span><div class="heat"><div class="heatrow"><span class="yl"></span>'+MN.map(m=>'<span class="yl" style="text-align:center">'+m[0]+'</span>').join('')+'</div></div></div>'); const heat=box.querySelector('.heat'); const cells=[];
    anos.forEach(a=>{ const row=el('<div class="heatrow"><span class="yl">'+a+'</span></div>'); for(let i=0;i<12;i++){ const v=ym(a,i); const n=el('<div class="hcell" title="'+fmt(v)+'"></div>'); row.appendChild(n); cells.push({ym:v,node:n}); } heat.appendChild(row); }); rangePicker(cells,(i,f)=>setRange(host,i,f)); mount(host,box); }
  function b30(host){ const id='dlm'+(++_uid); const meses=gerar(addMes(HOJEYM,-23),24);
    const box=el('<div><span class="lbl">Período (com sugestões)</span><div class="row"><input type="text" class="i1" list="'+id+'" placeholder="AAAA-MM"><span class="sep">até</span><input type="text" class="i2" list="'+id+'" placeholder="AAAA-MM"></div><datalist id="'+id+'">'+meses.map(m=>'<option value="'+m+'">'+fmt(m)+'</option>').join('')+'</datalist></div>');

  // helpers DOM
  function el(html){ const d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstElementChild; }
  function mount(host,box){ host.insertBefore(box, host.querySelector('.out')); }

  const grid=document.getElementById('grid');
  DEMOS.forEach(d=>{ const card=document.createElement('div'); card.className='demo';
    card.innerHTML='<h3>'+d.t+'</h3><div class="sub">'+d.s+'</div><div class="out">envia: <b>(nenhum)</b></div>';
    d.build(card); grid.appendChild(card);
  });
  document.addEventListener('click',()=>{ document.querySelectorAll('.dd.open,.pop.open').forEach(o=>o.classList.remove('open')); });
