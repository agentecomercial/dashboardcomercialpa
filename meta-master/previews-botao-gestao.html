<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Botão "Gestão à Vista" — 10 opções</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800;900&display=swap');
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#0e0e0e;color:#eee;font-family:'Archivo',system-ui,Segoe UI,Arial,sans-serif;padding:26px;}
  h1{font-size:21px;font-weight:900;letter-spacing:.5px;}
  .lead{color:#9a9a9a;font-size:13px;margin:6px 0 22px;max-width:820px;}
  .lead b{color:#F0C84A;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:18px;}
  .demo{background:#1a1a1a;border:1px solid #333;border-radius:14px;padding:18px;min-height:150px;display:flex;flex-direction:column;}
  .demo h3{font-size:13px;font-weight:900;color:#F0C84A;letter-spacing:.3px;margin-bottom:2px;}
  .demo .sub{font-size:11px;color:#888;margin-bottom:16px;}
  .stage{flex:1;display:flex;align-items:center;justify-content:center;background:#111;border-radius:10px;padding:18px;position:relative;}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#241f11;border:1px solid #F0C84A;color:#F0C84A;font-weight:700;font-size:13px;padding:10px 18px;border-radius:10px;opacity:0;transition:.2s;pointer-events:none;z-index:99;}
  .toast.on{opacity:1;}

  /* 1 pill sólido */
  .b1{display:inline-flex;align-items:center;gap:10px;background:#F0C84A;color:#111;font-weight:900;font-size:15px;padding:13px 26px;border-radius:30px;border:none;cursor:pointer;font-family:inherit;box-shadow:0 6px 18px rgba(240,200,74,.25);}
  .b1:hover{background:#ffd866;}
  /* 2 outline */
  .b2{display:inline-flex;align-items:center;gap:10px;background:transparent;color:#F0C84A;font-weight:800;font-size:15px;padding:12px 24px;border-radius:30px;border:2px solid #F0C84A;cursor:pointer;font-family:inherit;}
  .b2:hover{background:#F0C84A;color:#111;}
  /* 3 gradiente */
  .b3{display:inline-flex;align-items:center;gap:10px;background:linear-gradient(135deg,#22314f,#F0C84A);color:#fff;font-weight:900;font-size:15px;padding:14px 28px;border-radius:14px;border:none;cursor:pointer;font-family:inherit;text-shadow:0 1px 2px rgba(0,0,0,.4);}
  .b3:hover{filter:brightness(1.08);}
  /* 4 banner card */
  .b4{display:flex;align-items:center;gap:14px;width:100%;background:#20242e;border:1px solid #3a4258;border-left:4px solid #F0C84A;border-radius:12px;padding:14px 16px;cursor:pointer;font-family:inherit;text-align:left;}
  .b4:hover{background:#252a36;}
  .b4 .ic{font-size:26px;}
  .b4 .tt{flex:1;}
  .b4 .tt b{display:block;font-size:15px;font-weight:900;color:#F0C84A;letter-spacing:.3px;}
  .b4 .tt small{color:#9aa;font-size:11px;}
  .b4 .ar{color:#F0C84A;font-size:20px;font-weight:900;}
  /* 5 icone + seta */
  .b5{display:inline-flex;align-items:center;gap:0;background:#1c1c1c;border:1px solid #3a3a3a;border-radius:12px;overflow:hidden;cursor:pointer;font-family:inherit;}
  .b5 .l{background:#F0C84A;color:#111;font-size:18px;padding:13px 15px;}
  .b5 .m{padding:0 16px;font-weight:800;font-size:14px;color:#eee;}
  .b5 .r{color:#F0C84A;font-size:18px;font-weight:900;padding:0 15px 0 5px;}
  .b5:hover .m{color:#F0C84A;}
  /* 6 split dropdown */
  .dd{position:relative;display:inline-block;}
  .b6{display:inline-flex;align-items:center;gap:10px;background:#F0C84A;color:#111;font-weight:900;font-size:14px;padding:12px 22px;border-radius:10px;border:none;cursor:pointer;font-family:inherit;}
  .b6 .cv{font-size:11px;}
  .ddmenu{position:absolute;top:calc(100% + 8px);left:0;right:0;background:#1c1c1c;border:1px solid #444;border-radius:10px;padding:6px;box-shadow:0 14px 34px rgba(0,0,0,.55);display:none;min-width:200px;z-index:20;}
  .dd.open .ddmenu{display:block;}
  .ddmenu a{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:7px;color:#ddd;font-size:13px;font-weight:700;cursor:pointer;text-decoration:none;}
  .ddmenu a:hover{background:#262626;color:#F0C84A;}
  /* 7 grid de atalhos */
  .b7wrap{width:100%;text-align:center;}
  .b7wrap .ti{font-size:13px;font-weight:900;color:#F0C84A;letter-spacing:.4px;margin-bottom:10px;}
  .b7grid{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
  .b7grid button{background:#1c1c1c;border:1px solid #3a3a3a;color:#ddd;font-weight:800;font-size:12px;padding:11px 14px;border-radius:10px;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:78px;}
  .b7grid button:hover{border-color:#F0C84A;color:#F0C84A;}
  .b7grid .e{font-size:20px;}
  /* 8 full-width barra */
  .b8{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;background:linear-gradient(90deg,#1c1c1c,#2a2410,#1c1c1c);border:1px solid #4a3f1f;color:#F0C84A;font-weight:900;font-size:15px;letter-spacing:1px;padding:15px;border-radius:10px;cursor:pointer;font-family:inherit;}
  .b8:hover{background:#2a2410;}
  /* 9 glow */
  .b9{display:inline-flex;align-items:center;gap:10px;background:#F0C84A;color:#111;font-weight:900;font-size:15px;padding:14px 30px;border-radius:12px;border:none;cursor:pointer;font-family:inherit;box-shadow:0 0 0 0 rgba(240,200,74,.6);animation:pulse 2s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(240,200,74,.45);}70%{box-shadow:0 0 0 14px rgba(240,200,74,0);}100%{box-shadow:0 0 0 0 rgba(240,200,74,0);}}
  /* 10 minimalista */
  .b10{background:none;border:none;color:#eee;font-weight:800;font-size:16px;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:8px;padding:6px 2px;border-bottom:2px solid transparent;}
  .b10:hover{color:#F0C84A;border-bottom-color:#F0C84A;}
  .b10 .ar{color:#F0C84A;transition:.15s;}
  .b10:hover .ar{transform:translateX(4px);}
</style>
</head>
<body>
  <h1>🧭 Botão "Gestão à Vista" — 10 opções</h1>
  <p class="lead">Vai na <b>página inicial</b> (aba Card) e leva pras abas de gestão (Leads, Comandos, Negociações). Cada opção é clicável (no preview mostra um aviso). Diga o <b>número</b> e eu aplico no app — alguns (6 e 7) já abrem um menu com as abas.</p>
  <div class="grid" id="grid"></div>
  <div class="toast" id="toast"></div>

<script>
  let tt;
  function aviso(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('on'),1800); }
  function go(aba){ aviso('→ Abriria a aba: '+aba); }

  const OPTS=[
    {t:'1. Pill dourado sólido', s:'Botão redondo, cheio, com ícone. Direto e visível.', h:'<button class="b1" onclick="go(\'Comandos\')">📊 GESTÃO À VISTA</button>'},
    {t:'2. Contorno dourado', s:'Vazado; preenche no hover. Mais leve.', h:'<button class="b2" onclick="go(\'Comandos\')">📊 GESTÃO À VISTA</button>'},
    {t:'3. Gradiente navy→dourado', s:'Combina com a identidade (navy + dourado).', h:'<button class="b3" onclick="go(\'Comandos\')">📊 GESTÃO À VISTA</button>'},
    {t:'4. Banner (título + subtítulo)', s:'Faixa larga com ícone, nome e o que tem dentro.', h:'<button class="b4" onclick="go(\'Comandos\')"><span class="ic">📊</span><span class="tt"><b>GESTÃO À VISTA</b><small>Leads · Comandos · Negociações</small></span><span class="ar">›</span></button>'},
    {t:'5. Ícone + seta (entrar)', s:'Bloco com ícone à esquerda e seta à direita.', h:'<button class="b5" onclick="go(\'Comandos\')"><span class="l">📊</span><span class="m">GESTÃO À VISTA</span><span class="r">→</span></button>'},
    {t:'6. Botão + menu (dropdown)', s:'Abre um menu pra escolher a aba.', h:'<div class="dd"><button class="b6" onclick="toggleDD(this,event)">📊 GESTÃO À VISTA <span class="cv">▾</span></button><div class="ddmenu"><a onclick="go(\'Leads\')">📊 Leads</a><a onclick="go(\'Comandos\')">📋 Comandos</a><a onclick="go(\'Negociações\')">💼 Negociações</a></div></div>'},
    {t:'7. Atalhos diretos (grid)', s:'Título + um botão por aba, acesso em 1 toque.', h:'<div class="b7wrap"><div class="ti">📊 GESTÃO À VISTA</div><div class="b7grid"><button onclick="go(\'Leads\')"><span class="e">📊</span>Leads</button><button onclick="go(\'Comandos\')"><span class="e">📋</span>Comandos</button><button onclick="go(\'Negociações\')"><span class="e">💼</span>Negoc.</button></div></div>'},
    {t:'8. Barra larga (full-width)', s:'Faixa horizontal ocupando a largura toda.', h:'<button class="b8" onclick="go(\'Comandos\')">📊 GESTÃO À VISTA</button>'},
    {t:'9. Dourado com brilho (pulsa)', s:'Chama atenção com um leve pulso de luz.', h:'<button class="b9" onclick="go(\'Comandos\')">📊 GESTÃO À VISTA</button>'},
    {t:'10. Minimalista (texto + seta)', s:'Discreto, só texto com sublinhado no hover.', h:'<button class="b10">GESTÃO À VISTA <span class="ar">→</span></button>'},
  ];

  const grid=document.getElementById('grid');
  OPTS.forEach(o=>{ const d=document.createElement('div'); d.className='demo';
    d.innerHTML='<h3>'+o.t+'</h3><div class="sub">'+o.s+'</div><div class="stage">'+o.h+'</div>';
    grid.appendChild(d);
  });
  function toggleDD(btn,ev){ ev.stopPropagation(); const dd=btn.closest('.dd'); document.querySelectorAll('.dd.open').forEach(o=>{if(o!==dd)o.classList.remove('open');}); dd.classList.toggle('open'); }
  document.addEventListener('click',()=>document.querySelectorAll('.dd.open').forEach(o=>o.classList.remove('open')));
  document.querySelector('.b10').onclick=()=>go('Comandos');
</script>
</body>
</html>
